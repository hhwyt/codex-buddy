# Release: push a tag v<version> (same as package.json) → build the Windows installer and the Mac universal dmg,
# attach build provenance and upload build artifacts. The owner verifies them on Windows and publishes with npm run release:publish. Mac builds are ad-hoc signed only (站主 2026-11-13:
# 签名公证先不买). remote/config.json is NOT bumped here: it must be signed with the release key, which only lives on
# the owner's Mac (docs/release.md: edit, node scripts/sign-remote-config.mjs, commit config.json + config.json.sig).
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v0.1.1'
        required: true
      source_ref:
        description: 'Source branch or commit to build'
        required: false

permissions:
  contents: read

jobs:
  # 安装依赖 + 打包：只读仓库，产物用 artifact 传给下面的上传 job（npm 包里的代码拿不到 contents: write）
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist
          - os: macos-14
            script: dist:mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag matches package.json
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="$TAG"
          version="$(node -p "require('./package.json').version")"
          test "$tag" = "v$version" || { echo "tag $tag does not match package.json $version"; exit 1; }
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      - name: Build provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/*.exe
            release/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: error

  # 上传到 Release：只下载产物再上传，不跑 npm ci / npm install，也不跑仓库脚本
  upload:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release
          merge-multiple: true
      - name: Store installers in private draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-$(git rev-parse HEAD)"
          gh release view "$tag" || gh release create "$tag" --draft --target "$(git rev-parse HEAD)" --title "$tag" --notes "Installer verification"
          for file in release/*.exe release/*.dmg; do
            if [ -f "$file" ]; then gh release upload "$tag" "$file"; fi
          done

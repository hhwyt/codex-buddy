# Release: push a tag v<version> (same as package.json) → build the Windows installer and the Mac test app,
# attach build provenance, publish both on GitHub Releases, then bump remote/config.json's latest.version so the
# app's update check (U-01) sees it. Mac builds are unsigned for now (站主 2026-11-13: 签名公证先不买), so the Mac
# app's 立即更新 opens the download page (U-03).
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v0.1.1'
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            script: dist
          - os: macos-14
            script: dist:mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag matches package.json
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="$(node -p "require('./package.json').version")"
          test "$tag" = "v$version" || { echo "tag $tag does not match package.json $version"; exit 1; }
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      - name: Zip the Mac app
        if: runner.os == 'macOS'
        run: |
          app="$(find release -maxdepth 2 -name 'CodexBuddy.app' -type d | head -1)"
          version="$(node -p "require('./package.json').version")"
          ditto -c -k --keepParent "$app" "release/CodexBuddy-${version}-mac-arm64.zip"
      - name: Build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/*.exe
            release/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: ignore

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: CodexBuddy ${{ inputs.tag || github.ref_name }}
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          files: out/*
          fail_on_unmatched_files: true

  bump-remote-config:
    # The app reads remote/config.json through jsDelivr / GitHub: point latest.version at this release
    needs: publish
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Set latest.version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          node -e '
            const fs = require("fs");
            const f = "remote/config.json";
            const c = JSON.parse(fs.readFileSync(f, "utf8"));
            c.latest.version = process.argv[1].replace(/^v/, "");
            fs.writeFileSync(f, JSON.stringify(c, null, 2) + "\n");
          ' "$tag"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add remote/config.json
          git diff --cached --quiet && exit 0
          git commit -m "remote config: latest ${{ inputs.tag || github.ref_name }}"
          git push origin HEAD:main

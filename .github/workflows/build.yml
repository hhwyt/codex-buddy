name: build-windows
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2
      - name: Build
        working-directory: src-tauri
        run: tauri build --no-bundle
      - name: Name the exe
        shell: pwsh
        run: Copy-Item src-tauri/target/release/codex-buddy.exe "Codex搭子.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: codex-buddy-windows
          path: Codex搭子.exe

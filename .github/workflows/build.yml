name: build-windows
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # electron-builder downloads the Windows Electron build itself; the postinstall download is not needed
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: codex-buddy-windows-installer
          path: release/*.exe

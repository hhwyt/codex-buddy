[package]
name = "codex-buddy"
version = "0.1.0"
description = "Codex 搭子：一键装好 Codex，免费用 AI"
authors = ["hhwyt"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" enables Window::add_child, used to embed Zhipu's login page in the scan screen
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

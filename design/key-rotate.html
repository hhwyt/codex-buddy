<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Key 轮换原型</title>
<style>
:root { --ink:#0d0d0d; --ink-2:#5d5d5d; --ink-3:#8f8f8f; --line:#e5e5e5; --side:#f9f9f9; --hover:rgba(0,0,0,.05); --selected:rgba(0,0,0,.06);
  --blue:#0c8df6; --fill:#0a77d1; --red:#d92d20; --shadow:rgba(0,0,0,.12); --scrim:rgba(0,0,0,.28); --r-lg:18px; --pill:999px; }
* { box-sizing: border-box; }
body { margin: 0; background: #fff; font: 14px -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--ink); }
button { font: inherit; cursor: pointer; color: inherit; }
[hidden] { display: none !important; }

/* ---------- 框外：评审用 ---------- */
.outer { max-width: 1260px; margin: 0 auto; padding: 22px 24px 40px; }
.outer h1 { font-size: 20px; margin: 0 0 14px; }
.ctl { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; margin-bottom: 14px; font-size: 13px; color: var(--ink-2); }
.ctl .grp { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.ctl .grp > span { margin-right: 2px; }
.pill { border: 1px solid #d6d6d6; background: #fff; border-radius: var(--pill); padding: 5px 12px; font-size: 13px; }
.pill.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.reset { border: 0; background: none; text-decoration: underline; color: var(--ink-2); }
.notes { margin-top: 14px; font-size: 13px; color: var(--ink-2); line-height: 1.9; max-width: 980px; }
.notes b { color: var(--ink); }

/* ---------- 框内：App ---------- */
.frame { width: 980px; height: 640px; margin: 0; border: 1px solid #dcdcdc; border-radius: 12px; overflow: hidden; position: relative; display: grid; grid-template-columns: 140px 1fr; box-shadow: 0 16px 50px #0000000f; background: #fff; }
.side { background: var(--side); padding: 46px 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.lights { position: absolute; top: 16px; left: 16px; display: flex; gap: 8px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; } .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
.nav { border: 0; background: none; text-align: left; padding: 8px 10px; border-radius: 8px; font-size: 14px; }
.nav.on { background: var(--selected); font-weight: 500; }
.main { position: relative; display: flex; flex-direction: column; min-width: 0; }
.top { height: 52px; display: flex; justify-content: flex-end; align-items: center; padding: 0 12px; flex: none; }
.icon-btn { width: 32px; height: 32px; border: 0; background: none; border-radius: 8px; font-size: 16px; display: grid; place-items: center; }
.icon-btn:hover { background: var(--hover); }
.icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.page { flex: 1; display: flex; flex-direction: column; align-items: center; padding-top: 4px; transition: padding-right .45s cubic-bezier(.2,.8,.2,1); }
.withbrowser .page { padding-right: 440px; }
.mode { display: flex; background: var(--selected); border-radius: var(--pill); padding: 3px; font-size: 13px; margin-bottom: 22px; }
.mode span { padding: 3px 18px; border-radius: var(--pill); color: var(--ink-2); }
.mode span.on { background: #fff; color: var(--ink); font-weight: 500; box-shadow: 0 1px 3px var(--shadow); }

/* 银行卡 */
.stack { position: relative; width: 380px; height: 400px; }
.card { position: absolute; left: 0; width: 380px; height: 240px; border-radius: var(--r-lg); padding: 18px 20px; color: #fff; display: flex; flex-direction: column; box-shadow: 0 -4px 14px var(--shadow); }
.card.cur { z-index: 5; box-shadow: 0 -8px 24px var(--shadow), 0 22px 50px var(--shadow); }
.card.under { clip-path: inset(0 0 calc(100% - 72px) 0 round var(--r-lg)); }
.card.under .head { margin-top: 14px; }
.head { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 600; }
.logo { width: 34px; height: 34px; border-radius: 9px; background: #fff; padding: 3px; display: grid; place-items: center; flex: none; overflow: hidden; }
.logo img { width: 100%; height: 100%; object-fit: contain; }
.logo b { color: var(--ink); font-size: 16px; }
.st { margin-left: auto; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.num { margin-top: auto; font: 500 18px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .14em; display: flex; align-items: center; gap: 12px; position: relative; }
.num .tail { display: inline-block; min-width: 4ch; }
.num .tail.rolling { opacity: .7; }
.act { font: 500 12px/1 -apple-system, "Segoe UI", "PingFang SC", sans-serif; letter-spacing: 0; padding: 5px 9px; border-radius: var(--pill); border: 0; background: rgba(255,255,255,.18); display: inline-flex; align-items: center; gap: 4px; }
.act:hover { background: rgba(255,255,255,.3); }
.act svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.act.spin svg { animation: spin 1s linear infinite; }
.bot { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 14px; }
.lbl { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; opacity: .6; }
.val { font-size: 14px; font-weight: 500; }
.pay { text-align: right; }
.face-deepseek { background: #4d6bfe; } .face-zhipu { background: #1c1c1e; } .face-kimi { background: #16191e; }
.face-qwen { background: #615ced; } .face-minimax { background: #f0446a; } .face-hunyuan { background: #0b5cff; } .face-custom { background: #0d0d0d; }
.ring { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; animation: spin .9s linear infinite; }
.ok-dark { color: #5ab0ff; }

/* V1 卡上的小确认 */
.pop { position: absolute; left: 150px; top: 30px; z-index: 9; background: #fff; color: var(--ink); border-radius: 12px; box-shadow: 0 12px 36px rgba(0,0,0,.22); padding: 12px; width: 220px; font: 13px -apple-system, "Segoe UI", "PingFang SC", sans-serif; letter-spacing: 0; animation: pop .16s ease-out; }
.pop .warn { display: flex; gap: 6px; align-items: center; color: var(--ink-2); margin-bottom: 10px; }
.pop .row { display: flex; justify-content: flex-end; gap: 6px; }
.pop input { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font: 13px ui-monospace, Menlo, monospace; margin-bottom: 8px; }
.btn { border: 1px solid var(--line); background: #fff; border-radius: 9px; padding: 7px 14px; font-size: 13px; font-weight: 500; }
.btn:hover { background: #f6f6f6; }
.btn.primary { background: var(--fill); border-color: var(--fill); color: #fff; }
.btn.primary:hover { background: #0868ba; }
.btn:disabled { opacity: .5; cursor: default; }
/* 卡上三点进度 */
.dots { display: inline-flex; gap: 5px; align-items: center; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.3); transition: background .25s, transform .25s; }
.dots i.now { background: #fff; animation: blink .8s ease-in-out infinite; }
.dots i.done { background: #fff; }

/* 右侧浏览器 */
.browser { position: absolute; top: 0; right: 0; bottom: 0; width: 440px; background: #fff; border-left: 1px solid var(--line); display: flex; flex-direction: column; z-index: 20; animation: slide .45s cubic-bezier(.2,.8,.2,1); }
.bbar { height: 52px; display: flex; align-items: center; gap: 4px; padding: 0 8px; border-bottom: 1px solid var(--line); flex: none; }
.addr { flex: 1; background: var(--side); border-radius: var(--pill); padding: 6px 12px; font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bpage { flex: 1; overflow: auto; padding: 28px 26px; }
.login { display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 30px; }
.login .logo { width: 44px; height: 44px; border: 1px solid var(--line); }
.login h3 { margin: 0; font-size: 18px; }
.qr { width: 168px; height: 168px; border: 1px solid var(--line); border-radius: 10px; padding: 10px; cursor: pointer; position: relative; }
.qr svg { width: 100%; height: 100%; }
.qr .scanned { position: absolute; inset: 0; background: rgba(255,255,255,.92); display: grid; place-items: center; border-radius: 10px; font-size: 14px; color: var(--ink); }
.login small { color: var(--ink-3); font-size: 12px; }
.ktable { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 14px; }
.ktable th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: 12px; padding: 8px 6px; border-bottom: 1px solid var(--line); }
.ktable td { padding: 11px 6px; border-bottom: 1px solid var(--line); }
.ktable td.mono { font-family: ui-monospace, Menlo, monospace; }
.ktable tr.old td { background: #eaf4fe; }
.ktable tr.old td:first-child { box-shadow: inset 3px 0 0 var(--blue); }
.ktable tr.gone { opacity: 0; transition: opacity .35s; }
.ktable .del { border: 0; background: none; color: var(--red); padding: 2px 4px; }
.vh { font-size: 17px; font-weight: 600; margin: 0; }
.vconfirm { position: absolute; inset: 0; background: rgba(0,0,0,.25); display: grid; place-items: center; }
.vconfirm div { background: #fff; border-radius: 10px; padding: 18px; width: 270px; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.2); }
.vconfirm p { margin: 0 0 14px; }
.vconfirm .row { display: flex; justify-content: flex-end; gap: 6px; }
.vconfirm .danger { background: var(--red); border-color: var(--red); color: #fff; }

/* toast */
.toast { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 16px; border-radius: var(--pill); z-index: 60; font-size: 13px; white-space: nowrap; animation: rise .18s ease-out; }
.toast.error { background: #fff; color: var(--ink); border: 1px solid var(--line); box-shadow: 0 10px 32px rgba(0,0,0,.12); border-radius: 12px; display: flex; gap: 10px; align-items: center; padding: 9px 10px 9px 12px; }
.toast .x { width: 20px; height: 20px; border-radius: 50%; background: #fdecee; color: var(--red); display: grid; place-items: center; font-size: 11px; font-weight: 700; }
.help { border: 0; background: none; color: var(--ink-3); font-size: 13px; display: inline-flex; gap: 5px; align-items: center; }
.help svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.5; }

/* V2 安全面板 */
.security { position: absolute; top: 0; right: 0; bottom: 0; width: 340px; background: #fff; border-left: 1px solid var(--line); box-shadow: -8px 0 30px var(--shadow); padding: 16px 18px; z-index: 30; display: flex; flex-direction: column; gap: 6px; animation: slide .3s ease-out; }
.security h2 { margin: 0; font-size: 17px; }
.rb { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.ft { font-size: 13px; font-weight: 600; margin: 14px 0 4px; }
.krow { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.krow .logo { width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--line); padding: 2px; }
.krow .nm { flex: 1; min-width: 0; }
.krow .nm b { display: block; font-weight: 500; }
.krow .nm span { font: 12px ui-monospace, Menlo, monospace; color: var(--ink-2); }
.age { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.age.old { color: var(--red); }
.rot { width: 28px; height: 28px; border: 0; background: none; border-radius: 8px; display: grid; place-items: center; color: var(--ink-2); flex: none; position: relative; }
.rot:hover { background: var(--hover); color: var(--ink); }
.rot svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.rot.spin svg { animation: spin 1s linear infinite; color: var(--blue); }
.rot.done { color: var(--blue); }
.rot.fail { color: var(--red); }
.mini { font-size: 12px; padding: 4px 9px; border-radius: var(--pill); border: 1px solid var(--line); background: #fff; white-space: nowrap; }
.krow.dim { opacity: .45; }
.security { transition: right .45s cubic-bezier(.2,.8,.2,1); }
.withbrowser .security { right: 440px; animation: none; }
.krow input { width: 92px; border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font: 12px ui-monospace, Menlo, monospace; }

/* V3 弹窗 */
.scrim { position: absolute; inset: 0; background: var(--scrim); display: grid; place-items: center; z-index: 40; transition: padding-right .45s cubic-bezier(.2,.8,.2,1); }
.withbrowser .scrim { padding-right: 440px; }
.dialog { background: #fff; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.18); padding: 24px; width: 420px; animation: pop .18s ease-out; }
.dialog h2 { margin: 0 0 4px; font-size: 18px; display: flex; align-items: center; gap: 10px; }
.dialog h2 .logo { width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
.swap { font: 500 14px ui-monospace, Menlo, monospace; display: flex; align-items: center; gap: 10px; margin: 14px 0 22px; color: var(--ink-2); }
.swap s { color: var(--ink-3); }
.swap .new { color: var(--ink); }
.circles { display: flex; align-items: flex-start; justify-content: space-between; position: relative; margin: 0 6px 20px; }
.circles .line { position: absolute; top: 17px; left: 40px; right: 40px; height: 2px; background: var(--line); }
.circles .line i { display: block; height: 100%; width: 0; background: var(--blue); transition: width .5s ease; }
.c { position: relative; z-index: 1; width: 80px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-3); text-align: center; }
.c .o { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--line); background: #fff; display: grid; place-items: center; font-size: 15px; font-weight: 700; transition: all .3s; }
.c.now { color: var(--ink); } .c.now .o { border-color: var(--blue); border-top-color: transparent; animation: spin .9s linear infinite; }
.c.wait { color: var(--ink); } .c.wait .o { border-color: var(--blue); animation: pulse 1.4s ease-in-out infinite; }
.c.done { color: var(--ink); } .c.done .o { border-color: var(--blue); background: var(--blue); color: #fff; animation: none; }
.c.fail { color: var(--red); } .c.fail .o { border-color: var(--red); color: var(--red); animation: none; }
.dmsg { font-size: 14px; margin: 0 0 6px; min-height: 20px; }
.dmsg.err { color: var(--red); }
.drow { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.drow .help { margin-right: auto; }
.more { border: 0; background: none; color: var(--ink-3); font-size: 12px; padding: 0; display: inline-flex; align-items: center; gap: 4px; }
.log { margin-top: 8px; background: var(--side); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: 12px/1.7 ui-monospace, Menlo, monospace; color: var(--ink-2); }
.consequence { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 5px; }

.dialog.rs { width: 440px; padding: 30px; }
.rs h2 { font-size: 22px; margin: 0 0 12px; }
.rs-p { font-size: 14px; line-height: 1.8; color: var(--ink-2); margin: 0; }
.rs-c { font-size: 12px; color: var(--ink-3); margin: 8px 0 0; }
.rs-ok { width: 36px; height: 36px; border-radius: 50%; background: var(--fill); color: #fff; display: grid; place-items: center; font-weight: 700; margin-bottom: 14px; }
.rs .drow { margin-top: 27px; }
.bspin { display: inline-block; width: 12px; height: 12px; border: 2px solid #ffffff66; border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; vertical-align: -2px; margin-right: 7px; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes blink { 50% { opacity: .35; } }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(12,141,246,.15); } }
@keyframes pop { from { opacity: 0; transform: scale(.96); } }
@keyframes rise { from { opacity: 0; transform: translate(-50%, 6px); } }
@keyframes slide { from { transform: translateX(100%); } }
@keyframes flash { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,.7); } 100% { box-shadow: 0 0 0 14px rgba(255,255,255,0); } }
.card.flash { animation: flash .7s ease-out; }
</style>
</head>

function qrSVG() {
  let r = ''; let seed = 7;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  for (let y = 0; y < 25; y++) for (let x = 0; x < 25; x++) {
    const finder = (x < 7 && y < 7) || (x > 17 && y < 7) || (x < 7 && y > 17);
    const on = finder ? ((x % 18 === 0 || x % 18 === 6 || y % 18 === 0 || y % 18 === 6) || ((x % 18) > 1 && (x % 18) < 5 && (y % 18) > 1 && (y % 18) < 5)) : rnd() > .52;
    if (on) r += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return `<svg viewBox="0 0 25 25" fill="#111">${r}</svg>`;
}

/* ================= V1 卡上直接换 ================= */
function v1() {
  const d = VENDORS[S.vendor];
  drawStack(`<button class="act" id="chg">${ROT}换</button>`);

    pop.querySelector('#yes').onclick = ev => { ev.stopPropagation(); pop.remove(); v1Run(); };

async function v1Run() {
  const r = run, v = S.vendor, d = VENDORS[v];
  S.busy = true;
  const btn = $('chg'); btn.classList.add('spin'); btn.disabled = true;
  const dots = n => setSt(`<span class="dots">${[0, 1, 2].map(i => `<i class="${i < n ? 'done' : i === n ? 'now' : ''}"></i>`).join('')}</span>`);
  dots(0);
  if (S.kase === 'login') { setSt('<span class="ring"></span>等你登录'); await loginPage(v); if (!alive(r)) return; closeBrowser(); dots(0); }
  await sleep(900); if (!alive(r)) return;
  const nt = hex();
  dots(1); await sleep(1100); if (!alive(r)) return;
  if (S.kase === 'fail') {
    btn.classList.remove('spin'); btn.disabled = false; S.busy = false;
    setSt(`<span class="${d.okDark ? 'ok-dark' : ''}">✓ 能用</span>`);
    toast('没换成，还在用原来的 Key：新 Key 测不通', true);

  }
  dots(2);
  await roll(cur().querySelector('.tail'), nt);
  if (S.kase === 'manual') {
    setSt('<span class="ring"></span>去官网删旧 Key');
    const old = S.tails[v];
    await keysPage(v, nt); if (!alive(r)) return;
    S.tails[v] = old; closeBrowser();
  }
  await sleep(700); if (!alive(r)) return;
  S.tails[v] = nt;
  btn.classList.remove('spin'); btn.disabled = false; S.busy = false;

  toast(d.custom ? '换好了，新 Key 测通了' : '换好了，旧 Key 已作废');
  await sleep(2200); if (!alive(r)) return;
  setSt(`<span class="${d.okDark ? 'ok-dark' : ''}">✓ 能用</span>`);
}

function v2Confirm(list) {

async function v2Run(list) {

    const nt = hex();
    await roll(row.querySelector('.tl'), nt);
    if (kase === 'manual') {
      b.className = 'rot';
      const btn = document.createElement('button'); btn.className = 'mini'; btn.textContent = '去官网删';
      row.querySelector('.age').replaceWith(btn);
      const old = S.tails[v];

    const b = e.currentTarget; b.disabled = true; sc.querySelector('#later').disabled = true;
    sc.querySelector('#rst').textContent = open ? '正在打开 ChatGPT' : '正在重启 ChatGPT';
    b.innerHTML = '<span class="bspin"></span>' + (open ? '正在打开' : '正在重启');
    await sleep(1600); sc.remove();
  };
}

/* ---------- boot ---------- */
function start() {
  run++; S.busy = false;
  document.querySelectorAll('.scrim,.security,.browser,.toast,.pop').forEach(e => e.remove());
  $('frame').classList.remove('withbrowser');
  resetData(); markPills();
  $('notes').innerHTML = NOTES[S.ver];
  $('shield').onclick = () => { if ($('main').querySelector('.security')) $('main').querySelector('.security').remove(); else openSecurity(); };
  [v1, v2, v3][S.ver]();
  location.hash = 'v' + (S.ver + 1);
}
const m = /^#v([123])$/.exec(location.hash); if (m) S.ver = Number(m[1]) - 1;
start();
</script>

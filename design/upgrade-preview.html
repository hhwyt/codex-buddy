<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CodexBuddy 强制升级 · 简洁确认</title>
<style>
:root{--blue:#0c8df6;--fill:#0a77d1;--ink:#181a1e;--muted:#727780;--line:#e8eaee;--red:#bd2934;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink);background:#fff}*{box-sizing:border-box}body{margin:0;padding:30px 36px}button,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-size:14px;font-weight:550;padding:11px 18px}button:hover{background:#f6f7f8}button:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:3px}.primary{background:var(--fill);border-color:var(--fill);color:#fff}.primary:hover{background:#0867b7}h1{font-size:24px;letter-spacing:-.5px;margin:0 0 10px}header,.controls,.caption{max-width:1140px;margin:auto}header{margin-bottom:22px}header p,.caption{font-size:13px;color:var(--muted);line-height:1.8;margin-top:0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 18px}.tabs button{border-radius:99px;padding:9px 16px}.tabs [aria-selected=true]{color:var(--fill);border-color:var(--blue)}.controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:17px}.controls select{background:#fff;border:1px solid var(--line);padding:7px 10px;border-radius:8px}.controls button{font-size:13px;padding:7px 12px}.caption{margin-top:16px;min-height:44px}.frame{height:660px;max-width:1140px;margin:auto;display:flex;border:1px solid #dfe2e7;border-radius:17px;position:relative;overflow:hidden;box-shadow:0 16px 55px #1823320d}.sidebar{width:185px;border-right:1px solid var(--line);padding:26px 17px;flex-shrink:0}.brand{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:650;margin-bottom:35px}.brand img{width:28px;height:28px}.nav{font-size:14px;color:var(--muted);padding:14px;border-radius:9px}.nav.active{background:#f4f5f7;color:var(--ink)}.main{padding:64px 52px;flex:1;min-width:0}.main h2{font-size:27px;margin:0 0 27px}.card{max-width:530px;border:1px solid var(--line);border-radius:17px;padding:25px;margin-bottom:12px}.card-head{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:600}.card img{width:30px;height:30px;object-fit:contain}.badge{margin-left:auto;font-size:12px;color:var(--fill);font-weight:400}.model{margin-top:26px;font-size:14px}.key{color:var(--muted);font-size:13px;letter-spacing:2px;margin-top:16px}.small{display:flex;align-items:center;gap:13px;padding:18px 25px;font-size:14px;color:#626873}.small img{width:23px;height:23px}.small span:last-child{margin-left:auto}.version{position:absolute;bottom:24px;left:30px;font-size:12px;color:#8a8f97}.window{position:absolute;top:16px;right:17px;font-size:17px;color:#7b8088;display:flex;align-items:center;gap:24px}.window button{border:0;padding:0;font-weight:400;font-size:19px;color:inherit}.overlay{position:absolute;inset:0;background:#171b2333;display:flex;align-items:center;justify-content:center;padding:22px;z-index:2}.dialog{background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px;width:450px;box-shadow:0 22px 70px #10152022}.dialog h2{font-size:23px;letter-spacing:-.5px;margin:0 0 13px}.dialog p{color:#686e78;font-size:14px;line-height:1.8;margin:0}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:27px}.eyebrow{color:var(--muted);font-size:12px;margin-bottom:16px}.versions{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:19px 21px;margin:22px 0}.versions label{font-size:12px;color:var(--muted);display:block;margin-bottom:7px}.versions strong{font-size:25px;letter-spacing:-.6px}.versions .target strong{color:var(--fill)}.arrow{color:#969ca5;font-size:21px}.app-line{display:flex;gap:11px;align-items:center;margin-bottom:24px;font-size:14px;font-weight:600}.app-line img{width:35px;height:35px}.notes{padding:17px 0;margin:19px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.notes div{font-size:14px;line-height:2;color:#626873}.dot{color:var(--blue);margin-right:10px}.pill{font-size:12px;color:var(--fill);padding:5px 10px;border:1px solid var(--line);border-radius:99px;margin-left:auto}.circle{width:118px;height:118px;border:5px solid var(--line);border-top-color:var(--blue);border-right-color:var(--blue);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 26px;color:var(--fill);font-size:26px;font-weight:650}.v4 .dialog{text-align:center;width:430px;padding:34px}.v4 .actions{display:grid;grid-template-columns:1fr}.v4 .actions .primary{grid-row:1}.v5.overlay{justify-content:flex-end;padding:0}.v5 .dialog{height:100%;width:405px;border-radius:0;padding:48px 30px;display:flex;flex-direction:column}.v5 .actions{margin-top:auto;display:grid;grid-template-columns:1fr}.v5 .actions .primary{grid-row:1}.steps{border-top:1px solid var(--line);margin:24px 0;padding-top:15px}.step{display:flex;align-items:center;gap:13px;padding:12px 0;font-size:14px;color:#626873}.step span{height:24px;width:24px;border:1px solid var(--line);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}.step:first-child span{color:var(--blue);border-color:var(--blue)}.progress-area{margin-top:25px}.bar{height:5px;background:#eef0f3;border-radius:9px;overflow:hidden}.bar i{height:100%;width:0;display:block;background:var(--fill);transition:width .15s linear}.progress-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:10px}.spinner{width:38px;height:38px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:24px}.error-mark{font-size:30px;color:var(--red);margin-bottom:20px}.success{margin-top:24px;color:var(--fill);font-size:14px}.closed{position:absolute;inset:0;background:#fff;z-index:5;display:flex;align-items:center;justify-content:center;text-align:center}.closed h2{font-size:23px;margin:0 0 14px}.closed p{font-size:14px;color:var(--muted);margin:0}.mac-install{display:flex;gap:27px;align-items:center;justify-content:center;margin:30px 0;padding:20px;border:1px solid var(--line);border-radius:12px;font-size:13px}.mac-install img{width:48px;height:48px;display:block;margin:0 auto 9px}.folder{font-size:42px;display:block;text-align:center;margin-bottom:5px}.center{text-align:center}.dialog .subtle{font-size:12px;margin-top:13px}.current-message{margin-top:24px;color:var(--fill);font-size:14px}[hidden]{display:none!important}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.bar i{transition:none}.spinner{animation-duration:2s}}@media(max-width:800px){body{padding:20px 12px}.sidebar{width:145px;padding:24px 11px}.brand{font-size:13px}.main{padding:64px 22px}.frame{height:640px}.v5 .dialog{width:380px}}@media(max-width:520px){.sidebar,.version{display:none}.main{padding:64px 18px}.overlay{padding:12px}.dialog{padding:25px}.v5 .dialog{width:100%;padding:35px 25px}.controls{gap:10px}}
</style></head>
<body><header><h1>CodexBuddy 强制升级</h1><p>简洁确认 · 版本号为演示数据 · 不操作真实应用</p></header>
<div class="controls"><label>场景 <select id="scene"><option value="required">旧版必须升级</option><option value="offline">断网，无法校验版本</option><option value="download-error">下载失败</option><option value="install-error">安装失败</option><option value="latest">版本符合要求</option></select></label><label>系统 <select id="platform"><option value="win">Windows</option><option value="mac">Mac</option></select></label><button id="replay">重新体验</button><span id="description"></span></div>
<section class="frame" aria-label="CodexBuddy 原型窗口"><aside class="sidebar"><div class="brand"><img src="../ui/assets/icon.svg" alt="">CodexBuddy</div><div class="nav active">▣　模型</div><div class="nav">⚙　设置</div><div class="nav">?　帮助</div><div class="version">CodexBuddy <span id="installed-version">0.1.0</span></div></aside><div class="window" aria-hidden="true"><span>−</span><span>□</span><span>×</span></div><main class="main"><h2>模型</h2><div class="card"><div class="card-head"><img src="../ui/assets/logos/deepseek.png" alt=""><span>DeepSeek</span><span class="badge">✓ 正在用</span></div><div class="model">DeepSeek V3</div><div class="key">sk-•••• •••• •••• 8f2a</div></div><div class="card small"><img src="../ui/assets/logos/zhipu.png" alt=""><span>智谱</span><span>⌄</span></div><div class="card small"><img src="../ui/assets/logos/kimi.png" alt=""><span>Kimi</span><span>⌄</span></div><p class="current-message" role="status" id="current-message"></p></main><div id="overlay" class="overlay"></div><div id="closed" class="closed" hidden><div><h2>CodexBuddy 已退出</h2><p>这是原型演示，真实应用没有退出</p></div></div></section><p class="caption" id="caption"></p>
<script>
const $=id=>document.getElementById(id), overlay=$('overlay');
let version=1,phase='required',timer=null,pct=0;
const isMac=()=>$('platform').value==='mac';
const actions=(label='立即升级',action='upgrade')=>`<div class="actions"><button data-action="exit">退出 CodexBuddy</button><button class="primary" data-action="${action}">${label}</button></div>`;
const progress=()=>`<div class="progress-area"><div class="bar" role="progressbar" aria-label="下载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div><div class="progress-meta"><span>${pct}%</span><span>${(pct*1.28).toFixed(1)} / 128 MB</span></div></div>`;
function show(){
 overlay.className='overlay v'+version;overlay.hidden=false;let body='';
 if(phase==='required')body=`<h2 id="title">升级后继续使用</h2><p>请升级到 0.2.0</p>${actions()}`;
 if(phase==='offline')body=`<h2 id="title">连上网后才能使用</h2><p>需要联网校验版本。请检查网络后重试。</p>${actions('重新连接','reconnect')}`;
 if(phase==='checking')body='<div class="spinner" aria-hidden="true"></div><h2 id="title">正在校验版本</h2><p role="status">请稍等</p>';
 if(phase==='download')body=`${version===4?`<div class="circle">${pct}%</div>`:''}<h2 id="title">正在下载 0.2.0</h2>${progress()}<div class="actions"><button data-action="exit">退出 CodexBuddy</button></div>`;
 if(phase==='install')body='<div class="spinner" aria-hidden="true"></div><h2 id="title">正在安装更新</h2><p role="status">安装完成后会重新打开 CodexBuddy</p>';
 if(phase==='mac-install')body='<h2 id="title">安装 CodexBuddy</h2><div class="mac-install"><div><img src="../ui/assets/icon.svg" alt="">CodexBuddy</div><span class="arrow">→</span><div><span class="folder" aria-hidden="true">▱</span>应用程序</div></div><p>把 CodexBuddy 拖进「应用程序」并替换，然后重新打开。</p>'+actions('重新打开','finish');
 if(phase==='download-error')body=`<div class="error-mark" aria-hidden="true">ⓘ</div><h2 id="title">下载没成功</h2><p>请检查网络后重试。</p>${actions('重新下载','upgrade')}`;
 if(phase==='install-error')body=`<div class="error-mark" aria-hidden="true">ⓘ</div><h2 id="title">安装没成功</h2><p>请重试安装。</p>${actions('重试安装','install')}`;
 overlay.innerHTML=`<section class="dialog" role="dialog" aria-modal="true" aria-labelledby="title">${body}</section>`;
 overlay.querySelectorAll('[data-action]').forEach(button=>button.onclick=()=>act(button.dataset.action));overlay.querySelector('button')?.focus();
}
function act(action){
 if(action==='exit'){clearInterval(timer);overlay.hidden=true;$('closed').hidden=false;$('caption').textContent='退出路径：停止本次升级，工具关闭；再次打开时仍须联网校验版本。';return;}
 if(action==='finish'){finish();return;}
 if(action==='reconnect'){phase='checking';show();timer=setTimeout(()=>{phase='required';show();$('caption').textContent='模拟网络恢复：校验后发现版本过低，必须升级才能继续。'},700);return;}
 if(action==='install'){install();return;}
 if(action==='upgrade'){phase='download';pct=0;show();timer=setInterval(()=>{pct=Math.min(100,pct+5);const bar=overlay.querySelector('.bar');bar?.setAttribute('aria-valuenow',String(pct));if(bar)bar.firstElementChild.style.width=pct+'%';const meta=overlay.querySelector('.progress-meta');if(meta)meta.innerHTML=`<span>${pct}%</span><span>${(pct*1.28).toFixed(1)} / 128 MB</span>`;const circle=overlay.querySelector('.circle');if(circle)circle.textContent=pct+'%';if(pct===100){clearInterval(timer);install()}},90);}
}
function install(){if(isMac()){phase='mac-install';show();return;}phase='install';show();timer=setTimeout(finish,850);}
function finish(){clearInterval(timer);overlay.hidden=true;$('installed-version').textContent='0.2.0';$('current-message').textContent='';$('caption').textContent='升级完成：新版通过联网校验后回到模型页。原型用此状态演示安装成功。';}
function reset(){clearInterval(timer);clearTimeout(timer);$('closed').hidden=true;$('installed-version').textContent='0.1.0';$('current-message').textContent='';$('description').textContent='简洁确认';$('caption').textContent='点升级按钮体验下载到完成；上方可切换断网、失败和系统。强制升级不提供跳过入口。';phase=$('scene').value;if(phase==='latest'){overlay.hidden=true;$('installed-version').textContent='0.2.0';$('current-message').textContent='';$('caption').textContent='校验通过：正常进入模型页，不显示升级弹窗。';return;}show();}
document.addEventListener('keydown',event=>{if(overlay.hidden||$('closed').hidden===false)return;if(event.key==='Escape'){event.preventDefault();return;}if(event.key==='Tab'){const buttons=[...overlay.querySelectorAll('button')];if(!buttons.length){event.preventDefault();return;}const first=buttons[0],last=buttons.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}});
$('scene').onchange=reset;$('platform').onchange=reset;$('replay').onclick=reset;reset();
</script></body></html>

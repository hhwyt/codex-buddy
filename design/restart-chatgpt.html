<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChatGPT 重启提示 · 5 版原型</title>
<style>
:root{--accent:#0c8df6;--fill:#0a77d1;--ink:#181a1e;--muted:#727780;--line:#e8eaee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink);background:#fff}
*{box-sizing:border-box}body{margin:0;padding:32px 40px}button,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:11px 18px;font-size:14px;font-weight:550}button:hover{background:#f5f6f7}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.primary{background:var(--fill);border-color:var(--fill);color:#fff}.primary:hover{background:#0867b7}.primary:disabled{opacity:.55;cursor:wait}h1{font-size:24px;letter-spacing:-.5px;margin:0 0 9px}header p,.caption{font-size:14px;color:var(--muted);line-height:1.8;margin:0}header,.controls,.caption{max-width:1140px;margin-left:auto;margin-right:auto}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:23px 0 18px}.tab{border-radius:99px;padding:9px 16px}.tab[aria-selected=true]{color:var(--fill);border-color:var(--accent);background:#fff}.controls{display:flex;gap:15px;align-items:center;flex-wrap:wrap;margin-bottom:17px;font-size:13px;color:var(--muted)}select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}.controls button{padding:7px 12px;font-size:13px}.frame{max-width:1140px;margin:auto;border:1px solid #dfe2e7;border-radius:17px;box-shadow:0 16px 55px #1823320d;position:relative;overflow:hidden;background:#fff;height:670px;display:flex}.sidebar{width:190px;flex-shrink:0;padding:26px 16px;border-right:1px solid var(--line)}.brand{display:flex;gap:9px;align-items:center;font-size:16px;font-weight:650;margin-bottom:39px}.brand img{width:29px;height:29px}.nav{padding:13px 14px;font-size:14px;display:flex;gap:12px;align-items:center;border-radius:9px;color:var(--muted)}.nav.active{color:var(--ink);background:#f4f5f7}.nav svg{width:18px;height:18px}.version{position:absolute;bottom:24px;left:30px;font-size:12px;color:#8a8f97}.main{flex:1;padding:65px 54px;min-width:0}.main h2{font-size:27px;margin:0 0 27px;letter-spacing:-.7px}.window-buttons{position:absolute;right:17px;top:16px;color:#7b8088;display:flex;gap:25px;font-size:17px}.card{max-width:530px;border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:12px}.card-head{display:flex;align-items:center;gap:12px}.card-head img{width:33px;height:33px;object-fit:contain}.card-head strong{font-size:18px}.badge{margin-left:auto;color:var(--fill);font-size:12px}.model{font-size:14px;margin:29px 0 16px}.key{font-size:13px;letter-spacing:2px;color:var(--muted)}.card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:22px;color:var(--muted);font-size:12px}.card.small{padding:17px 24px;display:flex;align-items:center;gap:12px;color:#626873}.card.small img{width:23px;height:23px;object-fit:contain}.card.small span:last-child{margin-left:auto}.pending{max-width:530px;padding:15px 0;display:flex;gap:13px;align-items:center;border-top:1px solid var(--line);margin-top:21px;font-size:13px}.pending span{flex:1;line-height:1.7;color:#626873}.pending button{padding:8px 12px}.status{font-size:13px;color:var(--fill);margin-top:20px}.backdrop{position:absolute;inset:0;background:#171b232e;display:flex;align-items:center;justify-content:center;padding:22px;z-index:2}.dialog{width:440px;border:1px solid var(--line);border-radius:18px;background:#fff;padding:30px;box-shadow:0 22px 70px #10152022;animation:appear .17s ease-out}.dialog h2{font-size:22px;margin:0 0 12px;letter-spacing:-.5px}.dialog p{color:#686e78;font-size:14px;line-height:1.8;margin:0}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:27px}.symbol{width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:var(--accent);border:1px solid var(--line);border-radius:14px;font-size:27px;margin-bottom:23px}.v2{text-align:center;width:410px;padding:35px 30px}.v2 .symbol{margin:0 auto 22px}.v2 .actions{display:grid;grid-template-columns:1fr 1fr}.summary{border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:21px 0;padding:16px 0;display:flex;justify-content:space-between;align-items:center;font-size:14px}.summary .label{color:var(--muted)}.app-line{display:flex;align-items:center;gap:10px;margin-bottom:24px;font-size:13px;color:#6e747c}.app-line img{width:25px;height:25px}.v3{width:470px}.v4.backdrop{align-items:flex-end;padding:0}.v4 .dialog{width:100%;border-radius:18px 18px 0 0;padding:28px 36px;display:flex;gap:20px;align-items:center}.v4 .symbol{flex-shrink:0;margin:0}.v4 .message{flex:1}.v4 h2{font-size:20px}.v4 .actions{margin:0;flex-shrink:0}.v5.backdrop{justify-content:flex-end;padding:0}.v5 .dialog{height:100%;width:390px;border-radius:0;padding:62px 30px;box-shadow:-10px 0 40px #10152010;display:flex;flex-direction:column}.v5 .actions{margin-top:auto;display:grid;grid-template-columns:1fr}.v5 .actions .primary{grid-row:1}.v5 .summary{display:block}.v5 .summary strong{display:block;margin-top:9px;font-weight:550}.busy{width:35px;height:35px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 23px}.progress{text-align:center}.progress h2{margin-bottom:10px}.caption{margin-top:17px;min-height:42px}.baseline{max-width:530px;display:flex;gap:15px;align-items:center;margin-top:20px;border-top:1px solid var(--line);padding-top:17px;font-size:13px;color:var(--muted)}.baseline a{color:var(--fill)}[hidden]{display:none!important}@keyframes spin{to{transform:rotate(360deg)}}@keyframes appear{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.dialog{animation:none}.busy{animation-duration:2s}}@media(max-width:800px){body{padding:20px 12px}.frame{height:650px}.sidebar{width:145px;padding:23px 10px}.brand{font-size:13px}.main{padding:65px 22px}.v4 .dialog{display:block}.v4 .symbol{display:none}.v4 .actions{margin-top:20px}.version{left:22px}.card{padding:18px}.badge{font-size:11px}}@media(max-width:530px){.sidebar{display:none}.main{padding:65px 20px}.dialog{padding:25px;width:100%}.backdrop{padding:12px}.v5 .dialog{width:100%}.version{display:none}}
</style>
<header><h1>ChatGPT 重启提示</h1><p>5 版可点击原型 · 仅演示交互，不修改配置，不关闭任何应用</p><div class="tabs" role="tablist" aria-label="选择原型版本"></div></header>
<div class="controls"><label>场景 <select id="scenario"><option value="changed">配置已保存，ChatGPT 正在运行</option><option value="closed">配置已保存，ChatGPT 未运行</option><option value="failed">配置保存失败</option><option value="restart-failed">配置已保存，但重启失败</option><option value="baseline">现有提示方式</option></select></label><button id="replay">重新体验</button><span id="description"></span></div>
<section class="frame" aria-label="CodexBuddy 应用原型">
<aside class="sidebar"><div class="brand"><img src="../ui/assets/icon.svg" alt="">CodexBuddy</div><div class="nav active">▣　模型</div><div class="nav">⚙　设置</div><div class="nav">?　帮助</div><div class="version">CodexBuddy 0.1.0</div></aside>
<div class="window-buttons" aria-hidden="true"><span>−</span><span>□</span><span>×</span></div>
<main class="main"><h2>模型</h2><div class="card"><div class="card-head"><img src="../ui/assets/logos/deepseek.png" alt=""><strong>DeepSeek</strong><span class="badge" id="saved">✓ 配置已保存</span></div><div class="model">DeepSeek V3</div><div class="key">sk-•••• •••• •••• 8f2a</div><div class="card-foot"><span>换 Key</span><span>去充值 ›</span></div></div><div class="card small"><img src="../ui/assets/logos/zhipu.png" alt=""><span>智谱</span><span>⌄</span></div><div class="card small"><img src="../ui/assets/logos/kimi.png" alt=""><span>Kimi</span><span>⌄</span></div><div class="pending" id="pending" hidden><span>配置已保存<br>重启 ChatGPT 后生效</span><button id="pending-restart">立即重启</button></div><div class="status" id="status" role="status" aria-live="polite"></div><div class="baseline" id="baseline" hidden><span>重新打开 ChatGPT 生效</span><a href="#" id="baseline-open">打开 ChatGPT</a></div></main>
<div class="backdrop" id="overlay" hidden></div>
</section><p class="caption" id="caption"></p>
<script>
const versions=[['1','简洁确认','推荐：直接问是否重启，信息最少。'],['2','状态提示','先强调已保存，再提示重启生效。'],['3','变更摘要','列出本次保存的配置，再询问重启。'],['4','底部弹层','保留模型卡片可见，操作集中在底部。'],['5','右侧面板','在右侧完成确认，留出空间呈现重启状态。']];
const $=id=>document.getElementById(id);let current=1;let timer;let lastFocus;const overlay=$('overlay');
function nav(){document.querySelector('.tabs').innerHTML=versions.map(([id,name])=>`<button class="tab" id="tab-${id}" role="tab" aria-selected="${current===+id}" data-version="${id}">${id} · ${name}</button>`).join('');document.querySelectorAll('[data-version]').forEach(b=>b.onclick=()=>{current=+b.dataset.version;history.replaceState(null,'','#v'+current);nav();reset()});}
function hide(){overlay.hidden=true;overlay.innerHTML='';if(lastFocus?.isConnected)lastFocus.focus();}
function show(content,variant=current){lastFocus=document.activeElement;overlay.className='backdrop v'+variant;overlay.innerHTML=content;overlay.hidden=false;overlay.querySelector('button')?.focus();}
function actions(){return '<div class="actions"><button data-action="later">稍后</button><button class="primary" data-action="restart">立即重启</button></div>'}
function prompt(){
const warning='重启会中断正在进行的任务。';let body;
if(current===1)body=`<h2 id="dialog-title">现在重启 ChatGPT？</h2><p>配置已保存，重启后生效。${warning}</p>`;
if(current===2)body=`<div class="symbol" aria-hidden="true">✓</div><h2 id="dialog-title">配置已保存</h2><p>重启 ChatGPT 后生效。${warning}</p>`;
if(current===3)body=`<div class="app-line"><img src="../ui/assets/logos/openai.webp" alt="">ChatGPT</div><h2 id="dialog-title">重启后使用新配置</h2><div class="summary"><span class="label">模型厂商</span><strong>DeepSeek</strong></div><p>${warning}</p>`;
if(current===4)body=`<div class="symbol" aria-hidden="true">↻</div><div class="message"><h2 id="dialog-title">重启 ChatGPT 后生效</h2><p>配置已保存。${warning}</p></div>`;
if(current===5)body=`<div class="symbol" aria-hidden="true">↻</div><h2 id="dialog-title">重启 ChatGPT</h2><p>配置已保存，重启后生效。</p><div class="summary"><span class="label">模型厂商</span><strong>DeepSeek</strong></div><p>${warning}</p>`;
show(`<section class="dialog v${current}" role="dialog" aria-modal="true" aria-labelledby="dialog-title">${body}${actions()}</section>`);wire();
}
function wire(){overlay.querySelector('[data-action="later"]')?.addEventListener('click',later);overlay.querySelector('[data-action="restart"]')?.addEventListener('click',restart);}
function later(){hide();$('pending').hidden=false;$('status').textContent='';$('saved').textContent='✓ 配置已保存';$('caption').textContent='已选择「稍后」：页面持续保留待重启提示，可随时再次重启。';}
function restart(){
show('<section class="dialog progress" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="busy" aria-hidden="true"></div><h2 id="dialog-title">正在重启 ChatGPT</h2><p role="status">正在重新打开应用</p></section>');
timer=setTimeout(()=>{if($('scenario').value==='restart-failed'){show('<section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><h2 id="dialog-title">没能重新打开 ChatGPT</h2><p>配置已保存，重启后生效。</p><div class="actions"><button data-action="later">稍后</button><button class="primary" data-action="restart">再试一次</button></div></section>');wire();$('caption').textContent='异常状态：保留配置和重试入口，不显示已生效。';}else{hide();$('pending').hidden=true;$('saved').textContent='✓ 已重新打开';$('status').textContent='ChatGPT 已重新打开';$('caption').textContent='重启完成：回到模型页，待重启提示收起。';}},1100);
}
function reset(){clearTimeout(timer);hide();$('pending').hidden=true;$('baseline').hidden=true;$('status').textContent='';$('status').style.color='';$('saved').textContent='✓ 配置已保存';$('description').textContent=versions[current-1][2];$('caption').textContent='点「立即重启」或「稍后」体验完整路径；异常状态可在上方切换。';const scenario=$('scenario').value;
if(scenario==='baseline'){$('baseline').hidden=false;$('caption').textContent='现有定稿：只提示重新打开，用户自行操作。';return;}
if(scenario==='closed'){$('status').textContent='配置已保存，下次打开 ChatGPT 时生效';$('caption').textContent='ChatGPT 未运行：不弹重启确认框。';return;}
if(scenario==='failed'){$('saved').textContent='';$('status').style.color='#c12c35';$('status').textContent='没保存成功，配置未更改';$('caption').textContent='配置未保存：不触发重启，保留当前运行状态。';return;}
$('status').style.color='';prompt();
}
overlay.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();if(overlay.querySelector('[data-action="later"]'))later();}if(e.key==='Tab'){const b=[...overlay.querySelectorAll('button')];if(!b.length){e.preventDefault();return;}const first=b[0],last=b[b.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
$('scenario').onchange=reset;$('replay').onclick=reset;$('pending-restart').onclick=prompt;$('baseline-open').onclick=e=>{e.preventDefault();$('status').textContent='ChatGPT 已打开'};
const hash=location.hash.match(/^#v([1-5])$/);if(hash)current=+hash[1];nav();reset();
</script>
</html>

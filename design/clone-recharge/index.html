const app=document.getElementById('app'), t=document.getElementById('ptoast');
function toast(m){t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',1800);}
function show(m){app.innerHTML=V[m];}
app.addEventListener('click',e=>{
  const el=e.target.closest('[data-testid]'); if(!el) return; const id=el.dataset.testid;
  if(id==='mode-switch') show('switch'); else if(id==='mode-clone') show('clone');
  else if(id.startsWith('card-recharge-')) toast('打开 '+id.slice(14)+' 官方充值页');
  else if(id.startsWith('clone-open-')) toast('打开 '+id.slice(11)+' 分身');
  else if(id.startsWith('clone-remove-')) toast('删除分身（原型里不真删）');
  else if(id.startsWith('clone-make-')) toast('做成分身（原型里不真做）');
});

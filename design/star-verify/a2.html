<style>
:root{--accent:#0c8df6;--fill:#0a77d1;--ink:#0d0d0d;--ink-2:#5d5d5d;--ink-3:#8f8f8f;--line:#ededed;--side:#f9f9f9;--blue:#0285ff;--blue-bg:#e5f3ff;--green:#00a240;--red:#e02e2a;--scrim:rgba(0,0,0,.32);--shadow:rgba(0,0,0,.12);--face-zhipu:#1c1c1e;--face-deepseek:#4d6bfe;--face-openai:#ececec;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;letter-spacing:-.01em;color:var(--ink);background:#fff}
*{box-sizing:border-box}body{margin:0;padding:28px 36px 40px;-webkit-font-smoothing:antialiased}
button,select{font:inherit;letter-spacing:inherit}button{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:10px 18px;font-size:14px;font-weight:550}button:hover{background:#f5f6f7}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.pre{max-width:1180px;margin:0 auto}
.pre h1{font-size:22px;margin:0 0 6px;letter-spacing:-.4px}.pre p{margin:0;color:var(--ink-2);font-size:13px;line-height:1.8}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 14px}.tabs a{border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-size:13px;color:var(--ink);text-decoration:none}.tabs a[aria-current=page]{border-color:var(--accent);color:var(--fill)}
.controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px;font-size:13px;color:var(--ink-2)}.controls select{padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:#fff}.controls button{padding:6px 12px;font-size:13px}
.off{font-size:12px;color:var(--ink-3)}
.frame{max-width:1180px;min-width:1080px;height:680px;margin:0 auto;border:1px solid #dfe2e7;border-radius:14px;box-shadow:0 16px 55px #1823320d;position:relative;overflow:hidden;display:flex;background:#fff}
.side{width:200px;flex:none;background:var(--side);border-right:1px solid var(--line);padding:46px 10px 12px}
.brand{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;padding:8px 10px 18px}.brand svg{width:26px;height:26px}
.nav{padding:8px 10px;border-radius:8px;font-size:14px}.nav.on{background:rgba(0,0,0,.06)}
.winbtn{position:absolute;right:16px;top:14px;display:flex;gap:22px;color:#7b8088;font-size:15px;z-index:3}
.main{flex:1;min-width:0;position:relative;padding:56px 28px 28px;display:flex;flex-direction:column;align-items:center;gap:16px;overflow:auto}
.mcard{width:380px;height:240px;flex:none;border-radius:18px;padding:18px 20px;color:#fff;display:flex;flex-direction:column;box-shadow:0 -8px 24px var(--shadow),0 22px 50px var(--shadow)}
.mcard.light{color:#5d5d5d}.mcard .top{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600}
.logo{width:34px;height:34px;border-radius:9px;background:#fff;display:grid;place-items:center;color:var(--ink);font-size:15px;font-weight:700;flex:none}
.mcard .st{margin-left:auto;font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px}
.mcard .num{margin-top:auto;font:500 18px/1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.14em}
.mcard .bot{display:flex;justify-content:space-between;margin-top:14px;font-size:13px;opacity:.85}
.under{width:380px;height:40px;flex:none;border-radius:0 0 18px 18px;margin-top:-10px;opacity:.5}
.dialog h2{margin:0 0 10px;font-size:21px;letter-spacing:-.4px}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}.row.even{display:grid;grid-template-columns:1fr 1fr}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite;flex:none;display:inline-block}
.ok{color:var(--green)}.err{color:var(--red)}
.qa{border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.7;background:var(--side);text-align:left}
.qa .q{color:var(--ink-2)}.qa .a{margin-top:6px}.qa mark{background:var(--blue-bg);color:var(--ink);border-radius:4px;padding:0 3px}
.caret::after{content:"▍";animation:blink 1s steps(1) infinite;color:var(--ink-3)}
/* Right-side built-in browser, same frame as the 智谱 QR-login panel (ui/pip.css .browser-panel) */
.bpanel{width:470px;flex:none;display:flex;flex-direction:column;background:#fff;border-left:1px solid var(--line);animation:bin .45s cubic-bezier(.2,.8,.2,1);position:relative;z-index:2}
.bbar{height:52px;display:flex;align-items:center;gap:4px;padding:0 8px;border-bottom:1px solid var(--line);margin-top:0}
.bbtn{width:26px;height:26px;border:0;border-radius:8px;background:none;color:var(--ink-2);padding:0;font-size:15px;font-weight:400}.bbtn:hover{background:rgba(0,0,0,.04)}
.baddr{flex:1;min-width:0;height:28px;padding:0 10px;border:1px solid var(--line);border-radius:99px;background:var(--side);color:var(--ink-2);font-size:12px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bview{flex:1;overflow:auto;position:relative}
.bload{height:2px;background:var(--accent);animation:bload .9s ease-out forwards}
.bmsg{padding:40px 24px;text-align:center;color:var(--ink-2);font-size:13px;line-height:1.8}
.gh{font-size:13px;color:#1f2328;line-height:1.6}
.gh .top{padding:14px 18px;border-bottom:1px solid #d1d9e0;background:#f6f8fa;display:flex;align-items:center;gap:10px}
.gh .top .dot{width:24px;height:24px;border-radius:50%;background:#1f2328}
.gh .top .sg{margin-left:auto;font-size:12px;color:#59636e}
.gh .repo{padding:16px 18px 0;display:flex;align-items:center;gap:8px;font-size:16px}
.gh .repo b{font-weight:600}.gh .pub{font-size:11px;border:1px solid #d1d9e0;border-radius:99px;padding:0 7px;color:#59636e}
.gh .acts{display:flex;gap:8px;padding:12px 18px 14px;border-bottom:1px solid #d1d9e0}
.gh .acts button{padding:4px 10px;font-size:12px;font-weight:500;border-radius:6px;border:1px solid #d1d9e0;background:#f6f8fa;color:#1f2328}
.gh .acts .star{position:relative}
.gh .acts .star.on{color:#9a6700}
.gh .acts .star.pulse{box-shadow:0 0 0 3px var(--accent);animation:pulse 1.4s ease-in-out 3}
.gh .hint{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:#fff;font-size:12px;padding:5px 10px;border-radius:8px;pointer-events:none}
.gh .hint::before{content:"";position:absolute;top:-4px;left:50%;margin-left:-4px;width:8px;height:8px;background:var(--ink);transform:rotate(45deg)}
.gh .readme{margin:16px 18px;border:1px solid #d1d9e0;border-radius:6px;padding:16px}
.gh .readme h3{margin:0 0 6px;font-size:18px}
.gh .login{margin:40px auto;width:300px;border:1px solid #d1d9e0;border-radius:6px;padding:18px;background:#f6f8fa}
.gh .login h3{margin:0 0 12px;font-size:16px;text-align:center}
.gh .login .in{height:30px;border:1px solid #d1d9e0;border-radius:6px;background:#fff;margin-bottom:10px}
.gh .login button{width:100%;background:#1f883d;border-color:#1f883d;color:#fff;padding:7px;font-size:13px}
.gh .login p{font-size:12px;color:#59636e;margin:10px 0 0;text-align:center}
.caption{max-width:1180px;margin:14px auto 0;font-size:13px;color:var(--ink-2);min-height:22px}
[hidden]{display:none!important}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes blink{50%{opacity:0}}@keyframes fade{from{opacity:0}}@keyframes up{from{opacity:0;transform:translateY(8px)}}@keyframes bin{from{margin-right:-470px}}@keyframes bload{from{width:0}to{width:100%}}@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(12,141,246,.25)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}.spin{animation-duration:2s!important}}

.mscrim{position:absolute;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:2;animation:fade .15s}
.dlg{background:#fff;border-radius:18px;padding:26px;width:380px;max-width:calc(100% - 24px);box-shadow:0 12px 40px var(--shadow);animation:up .18s ease-out}
.dlg h2{margin:0 0 14px;font-size:20px;letter-spacing:-.4px;display:flex;align-items:center;gap:10px}
.kv{display:grid;grid-template-columns:20px 1fr;gap:10px 8px;font-size:13px;line-height:1.6}
.kv dt{color:var(--ink-3)}.kv dd{margin:0;word-break:break-all;display:flex;gap:6px;align-items:center}
#sa{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}#sa:empty{display:none}
.dlg .close{margin-top:16px;display:flex;justify-content:flex-end}

.opt{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer;text-align:left;line-height:1.5}.opt input{margin:3px 0 0;width:16px;height:16px;accent-color:var(--fill)}
.opt small,.sa-ask small{display:block;color:var(--ink-3);font-size:12px}
.sa-done{margin:0;font-size:14px;display:flex;gap:8px;align-items:center}
.sa-ask p{margin:0;font-size:14px;line-height:1.6}
</style>

<label>选好的模型 <select id="model"><option value="deepseek">DeepSeek</option><option value="zhipu">智谱 GLM（免费）</option><option value="openai">OpenAI 官方账号</option></select></label>
<label>模拟结果 <select id="scenario"><option value="ok">一次就成功</option><option value="key">第一次失败：Key 不对，重试成功</option><option value="net">第一次失败：连不上模型，重试成功</option><option value="wrong">第一次答非所问，重试成功</option><option value="gh">模型答对，GitHub 第一次没打开</option></select></label>

<script>
const $=id=>document.getElementById(id);
const MODELS={deepseek:{name:'DeepSeek',full:'DeepSeek V3',face:'var(--face-deepseek)',letter:'D',key:'sk-•••• •••• 8f2a',bot:'余额 · 去充值 ›'},zhipu:{name:'智谱 GLM',full:'GLM-4.5 免费版',face:'var(--face-zhipu)',letter:'智',key:'•••• •••• 3c1d',bot:'免费'},openai:{name:'OpenAI',full:'GPT-5',face:'var(--face-openai)',letter:'O',light:true,key:'已登录 ChatGPT 账号',bot:''}};
const REPO='https://github.com/hhwyt/codex-buddy',SHORT='github.com/hhwyt/codex-buddy';
const QUESTION='CodexBuddy 的 GitHub 地址是什么？只回答网址。';
const FAILS={key:'{m} 说 Key 不对。',net:'连不上 {m}，可能是网络问题。',wrong:'{m} 回答了，但没答出地址。'};
let attempt=0,timers=[],pageTries=0,pageOk=false,loggedIn=false,wantStar=false;
const M=()=>MODELS[$('model').value];
const later=(fn,ms)=>{timers.push(setTimeout(fn,ms))};
const sleep=ms=>new Promise(r=>later(r,ms));
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function caption(t){$('caption').textContent=t}
/* Ask the chosen model one question. Fake: the first try fails per「模拟结果」, a retry succeeds. */
function ask(){const sc=$('scenario').value,first=attempt++===0,m=M().name;return new Promise(res=>later(()=>{
 if(first&&FAILS[sc])res({ok:false,reason:FAILS[sc].replace('{m}',m),answer:sc==='wrong'?'抱歉，我不确定这个项目的地址。':''});
 else res({ok:true,answer:REPO,secs:(1.2+Math.random()*1.4).toFixed(1)});
},sc==='net'&&first?2200:1500))}
function card(st){const m=M();return `<div class="mcard${m.light?' light':''}" style="background:${m.face}"><div class="top"><span class="logo">${m.letter}</span><span>${m.name}</span><span class="st" id="cardst">${st||''}</span></div><div class="num">${m.key}</div><div class="bot"><span>${m.full}</span><span>${m.bot}</span></div></div>`}
function pile(){return `<div class="under" style="background:var(--face-zhipu)"></div>`}

/* ---- right-side built-in browser ---- */
function panel(){return $('bp')}
function openPanel(){if(!panel()){document.querySelector('.frame').insertAdjacentHTML('beforeend',`<aside class="bpanel" id="bp" aria-label="内置浏览器"><div class="bbar"><button class="bbtn" disabled aria-label="后退">‹</button><button class="bbtn" id="breload" aria-label="刷新">↻</button><div class="baddr" id="baddr">${REPO}</div><button class="bbtn" id="bshrink" aria-label="缩小">⤡</button><button class="bbtn" id="bclose" aria-label="关闭">✕</button></div><div class="bview" id="bview"></div></aside>`);
 $('breload').onclick=()=>load();$('bclose').onclick=()=>{closePanel();caption('关了右边的浏览器。')};$('bshrink').onclick=()=>caption('缩小成右下角小窗（原型里不演示）。');}
 return load()}
function closePanel(){panel()?.remove();pageOk=false}
/* Load the repo page; the first load fails in the「GitHub 第一次没打开」scenario. Calls onPage(ok) in the version. */
function load(){return new Promise(res=>{const v=$('bview');v.innerHTML=`<div class="bload"></div><div class="bmsg">正在打开 ${SHORT}</div>`;
 later(()=>{if(!panel())return res(false);const fail=$('scenario').value==='gh'&&pageTries++===0;
  if(fail){pageOk=false;v.innerHTML=`<div class="bmsg"><b style="color:var(--ink)">这个页面没打开</b><br>${SHORT} 暂时连不上，可能是网络问题。<br><br><button id="bretry">重新加载</button></div>`;$('bretry').onclick=()=>load();}
  else{pageOk=true;renderRepo()}
  if(typeof onPage==='function')onPage(pageOk);res(pageOk)},950)})}
function renderRepo(){const s=$('bstar')?.classList.contains('on')||window.__starred;$('bview').innerHTML=`<div class="gh"><div class="top"><span class="dot"></span><span>GitHub</span><span class="sg">${loggedIn?'已登录':'Sign in'}</span></div><div class="repo"><span>hhwyt / <b>codex-buddy</b></span><span class="pub">Public</span></div><div class="acts"><button>Watch</button><button>Fork</button><button class="star${s?' on':''}" id="bstar">${s?'★ Starred':'☆ Star'} <span>${s?129:128}</span></button></div><div class="readme"><h3>CodexBuddy</h3>Windows 上一键装好 Codex，免费用智谱模型；装好后可以换模型、换中文、一键还原。</div></div>`;
 $('bstar').onclick=clickStar}
function mark(t){const b=$('bstar');if(!b)return;b.classList.add('pulse');b.querySelector('.hint')?.remove();b.insertAdjacentHTML('beforeend',`<span class="hint">${t}</span>`)}
function showLogin(then){$('bview').innerHTML=`<div class="gh"><div class="login"><h3>登录 GitHub</h3><div class="in"></div><div class="in"></div><button id="blogin">登录（模拟）</button><p>账号密码只在 GitHub 页面里填，CodexBuddy 看不到。</p></div></div>`;$('baddr').textContent='https://github.com/login';caption('右侧浏览器里还没登录 GitHub：先由用户自己登录，登录后自动接着点。');
 $('blogin').onclick=()=>{loggedIn=true;$('baddr').textContent=REPO;renderRepo();then()}}
function clickStar(){if(!loggedIn){showLogin(()=>{window.__starred=true;renderRepo();starred()});return}
 window.__starred=!window.__starred;renderRepo();if(window.__starred)starred();else caption('取消了 Star。')}
function starred(){wantStar=false;if(typeof onStarred==='function')onStarred()}
/* 帮我点赞: open (or reload) the repo page on the right, then CodexBuddy clicks Star with the user's own GitHub login,
   in plain view. Only after the user pressed the button that says so. */
async function autoStar(){wantStar=true;if(!panel())await openPanel();else if(!pageOk)await load();if(!pageOk){caption('GitHub 没打开，点不了。可以在右边重新加载，或者跳过。');return}
 if(window.__starred){mark('✓ 之前点过');caption('之前已经点过 Star，不重复点。');starred();return}
 if(lg()==='gh'){mark('正在用 gh 点 Star…');caption('用 gh 命令行（gh api -X PUT /user/starred/hhwyt/codex-buddy）点 Star，右边页面跟着刷新。');later(()=>{window.__starred=true;renderRepo();mark('✓ 已用 gh 点好');starred()},1100);return}
 if(!loggedIn){showLogin(()=>later(press,400));return}
 press()}
function press(){mark('正在帮你点 Star…');caption('在右边的浏览器里自动点 Star，看得见每一步。');later(()=>{window.__starred=true;renderRepo();mark('✓ 已点 Star');caption('点好了：用的是你自己的 GitHub 账号。不想要可以在右边再点一下取消。');starred()},1100)}
function reset(){timers.forEach(clearTimeout);timers=[];attempt=0;pageTries=0;pageOk=false;wantStar=false;loggedIn=['in','starred'].includes($('login').value);window.__starred=$('login').value==='starred';closePanel();caption('');start()}
$('replay').onclick=reset;$('model').onchange=reset;$('scenario').onchange=reset;$('login').onchange=reset;
document.querySelector('.tabs a[href="a2.html"]').setAttribute('aria-current','page');
const MODE='auto';let verified=false,starBusy=false,skipped=false;
/* Star area (#sa), shared by every layout.
   auto (GitHub already logged in): one unticked box; ticked → CodexBuddy stars as soon as the page is open, then only「✓ 已点 Star」.
   ask (not logged in): after verification one line + 跳过 / 去点赞; 去点赞 → GitHub login page → starred automatically. */
function renderStar(){const a=$('sa');if(!a)return;
 if(window.__starred&&!starBusy){a.innerHTML='<p class="sa-done"><span class="ok">✓</span> 已点 Star</p>';return}
 if(starBusy){a.innerHTML='<p class="sa-done"><span class="spin"></span> 正在右边点 Star</p>';return}
 if(MODE==='auto'){a.innerHTML=`<label class="opt"><input type="checkbox" id="opt"${window.__opt?' checked':''}><span>给 CodexBuddy 点个 Star</span></label>`;
  $('opt').onchange=e=>{window.__opt=e.target.checked;if(e.target.checked&&pageOk)go()};return}
 if(skipped){a.innerHTML='<p class="sa-done"><span class="ok">✓</span> 装好了</p>';return}
 if(!verified){a.innerHTML='';return}
 a.innerHTML='<div class="sa-ask"><p>给 CodexBuddy 点个 Star？</p><div class="row even"><button id="skip">跳过</button><button id="star">去点赞</button></div></div>';
 $('skip').onclick=()=>{skipped=true;closePanel();renderStar();caption('跳过了点赞，也算装好。')};$('star').onclick=go}
function go(){starBusy=true;renderStar();autoStar()}
function onStarred(){starBusy=false;renderStar()}
function onPage(ok){if(ok&&MODE==='auto'&&window.__opt&&!window.__starred&&!starBusy)go();UI.opened(ok);renderStar()}
/* Shared order: ask the model → its answer → open that address on the right */
async function flow(ui){ui.asking();const r=await ask();if(!r.ok){ui.failed(r);return}ui.answered(r);await sleep(500);ui.opening();await openPanel()}
function lg(){return $('login').value}

let A;
function dlg(){const m=M();const head=A.state==='run'?'<span class="spin"></span>正在验证':A.state==='fail'?'<span class="err">✕</span>没验证成功':`<span class="ok">✓</span>${m.name} 能用了`;
 const page=A.page==='run'?'<span class="spin"></span>正在打开':A.page==='done'?`<span class="ok">✓</span>${SHORT}`:A.page==='fail'?'<span class="err">没打开，可能是网络问题</span>':'—';
 const q=A.state==='fail'?'<span class="err">✕</span>':A.ans?'<span class="ok">✓</span>':'<span class="spin"></span>';const pg=A.page==='run'?'<span class="spin"></span>':A.page==='done'?'<span class="ok">✓</span>':A.page==='fail'?'<span class="err">✕</span>':'·';
 $('dh').innerHTML=head;$('kv').innerHTML=`<dt>${q}</dt><dd>测试 Codex</dd><dt>${pg}</dt><dd>尝试打开本项目的 GitHub Repo</dd>`}

 answered(r){A.ans=`<mark>${REPO}</mark>`;dlg()},

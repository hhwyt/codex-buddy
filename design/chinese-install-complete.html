<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉化版安装完成 · 三版原型</title><style>

sition:absolute;bottom:25px;left:20px;right:20px;text-align:center;font-size:14px;color:#30353d}.replay{margin:22px auto 0;display:block;font-weight:500}.v3 .primary{flex:1}.v3 .actions{flex-direction:row}.v3 h2{font-size:22px}@media(max-width:950px){.grid{grid-template-columns:1fr}.scene{height:430px}.dialog{max-width:410px}body{padding:24px}}
.scene{height:530px}.saved b{font-size:22px}.shortcut{text-align:center;margin:24px 0}.shortcut-icon{position:relative;display:inline-grid;place-items:center;width:70px;height:70px;border:1px solid #e8eaee;border-radius:18px;background:white}.shortcut-icon img{width:46px;height:46px}.badge{position:absolute;right:-4px;bottom:-4px;color:white;background:#0a77d1;border:3px solid white;border-radius:9px;padding:2px 5px;font-size:13px;font-weight:600}.shortcut strong{display:block;font-size:16px;margin-top:13px;font-weight:600}.shortcut small{display:block;color:#737982;margin-top:7px;font-size:13px}.v3 .actions{flex-direction:row}.v3 .primary{flex:initial}.toolbar{display:flex;gap:8px;align-items:center;margin:18px 0 0;font-size:13px;color:#737982}.toolbar button{padding:7px 14px;font-size:13px}.toolbar button[aria-pressed=true]{color:#0a77d1;border-color:#0a77d1}.hint{font-size:12px;margin-top:15px}</style><header><h1>汉化版安装完成 · 启动说明</h1><p>默认安装英文版，仅在设置中点击「安装汉化版」后显示完成弹窗</p><div class="toolbar">查看平台 <button data-os="win" aria-pressed="true">Windows</button><button data-os="mac" aria-pressed="false">Mac</button></div></header><main class="grid"><article><div class="version">01 · 一句话说明</div><section class="scene" id="v1"><div class="brand"><img src="../ui/assets/icon.svg" alt="">CodexBuddy</div><div class="saved"><b>设置</b>汉化版已安装</div><div class="scrim"><div class="dialog" role="dialog" aria-labelledby="t1"><h2 id="t1">汉化版已安装</h2><p data-instruction></p><div class="actions"><button class="primary" data-action="close">知道了</button></div></div></div><div class="result" role="status"></div></section><p class="caption">只说明启动位置，适合最简提示。</p></article><article><div class="version">02 · 展示启动图标</div><section class="scene" id="v2"><div class="brand"><img src="../ui/assets/icon.svg" alt="">CodexBuddy</div><div class="saved"><b>设置</b>汉化版已安装</div><div class="scrim"><div class="dialog" role="dialog" aria-labelledby="t2"><h2 id="t2">从这个图标打开</h2><p>以后想用中文，就打开「ChatGPT 汉化版」</p><div class="shortcut"><div class="shortcut-icon"><img src="../ui/assets/logos/openai.webp" alt=""><span class="badge">中</span></div><strong>ChatGPT 汉化版</strong><small data-location></small></div><div class="actions"><button class="primary" data-action="close">知道了</button></div></div></div><div class="result" role="status"></div></section><p class="caption">图标、名称和位置放在一起，方便用户认出来。</p></article><article><div class="version">03 · 安装后立即体验</div><section class="scene" id="v3"><div class="brand"><img src="../ui/assets/icon.svg" alt="">CodexBuddy</div><div class="saved"><b>设置</b>汉化版已安装</div><div class="scrim"><div class="dialog" role="dialog" aria-labelledby="t3"><div class="check" aria-hidden="true">✓</div><h2 id="t3">汉化版装好了</h2><p data-instruction></p><div class="actions"><button data-action="close">稍后</button><button class="primary" data-action="open">打开汉化版</button></div></div></div><div class="result" role="status"></div></section><p class="caption">既说明以后怎么打开，也提供现在体验的入口。</p></article></main><button class="replay" onclick="location.reload()">重新查看弹窗</button><script>
let os='win';
function update(){document.querySelectorAll('[data-instruction]').forEach(el=>el.textContent=os==='win'?'以后从桌面双击「ChatGPT 汉化版」，就能使用中文':'以后在「应用程序」中打开「ChatGPT 汉化版」，就能使用中文');document.querySelectorAll('[data-location]').forEach(el=>el.textContent=os==='win'?'已添加到桌面和开始菜单':'已添加到「应用程序」');document.querySelectorAll('[data-os]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.os===os)));}
function close(scene,message){scene.querySelector('.scrim').style.display='none';scene.querySelector('.result').textContent=message;}
document.querySelectorAll('[data-os]').forEach(b=>b.onclick=()=>{os=b.dataset.os;update()});
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const scene=b.closest('.scene');if(b.dataset.action==='close'){close(scene,'已关闭提示，汉化版入口保留');return;}const box=scene.querySelector('.dialog');box.innerHTML='<h2>现在打开汉化版？</h2><p>如果 ChatGPT 正在运行，会先退出再打开，正在进行的任务会中断</p><div class="actions"><button id="cancel-open">稍后</button><button class="primary" id="confirm-open">打开汉化版</button></div>';box.setAttribute('aria-label','现在打开汉化版？');box.removeAttribute('aria-labelledby');box.querySelector('#cancel-open').onclick=()=>close(scene,'汉化版已安装，可随时从图标打开');box.querySelector('#confirm-open').onclick=()=>close(scene,'原型演示：打开 ChatGPT 汉化版');});update();
</script></html>

<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>商城导流方案</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#17191d;background:#fff;--line:#e8eaee;--muted:#737982;--blue:#0a77d1;--accent:#0c8df6;--red:#c82f39}
*{box-sizing:border-box}body{margin:0;padding:26px 30px}
header,.tabs,.frame,.note{max-width:1260px;margin-left:auto;margin-right:auto}
h1{font-size:24px;margin:0 0 6px;letter-spacing:-.5px}header p,.note{font-size:13px;color:var(--muted);line-height:1.8;margin:0}
button{font:inherit;cursor:pointer}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px auto 14px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 13px;font-size:13px;color:#30353d}
.tabs button[aria-pressed=true]{background:#eef5fd;border-color:#cfe3f7;color:var(--blue);font-weight:650}
.frame{height:640px;position:relative;border:1px solid #e0e3e8;border-radius:17px;background:#fff;overflow:hidden;box-shadow:0 16px 50px #1522390b;display:flex}
.side{width:170px;background:#f7f7f8;border-right:1px solid var(--line);padding:60px 12px;display:flex;flex-direction:column;gap:4px}
.brand{position:absolute;top:20px;left:22px;font-weight:650;display:flex;gap:8px;align-items:center}.brand img{width:22px}
.side button{text-align:left;border:none;background:none;padding:9px 12px;border-radius:9px;font-size:14px;color:#30353d;position:relative}
.side button[aria-current=page]{background:#e9e9ec;font-weight:650}
.dot{position:absolute;top:6px;left:44px;background:var(--red);color:#fff;font-size:10px;border-radius:9px;padding:1px 6px;font-weight:650}
.main{flex:1;display:flex;min-width:0}
.page{flex:1;padding:56px 40px;overflow:auto;min-width:0}
.browser{width:0;transition:width .35s;border-left:1px solid var(--line);background:#fafafa;overflow:hidden;position:relative}
.browser.open{width:420px}
.bar{height:40px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 12px;font-size:12px;color:var(--muted);gap:8px;background:#fff}
.bar .x{margin-left:auto;border:none;background:none;font-size:16px;color:var(--muted)}
.site{padding:40px 36px;text-align:center}
.site .logo{width:44px;height:44px;margin:0 auto 18px;border-radius:12px;background:#000;color:#fff;display:grid;place-items:center;font-weight:700}
.site h3{margin:0 0 18px;font-size:20px}
.site input{width:100%;padding:11px 12px;border:1px solid #d5d8dd;border-radius:8px;margin-bottom:10px;font:inherit}
.site .go{width:100%;padding:11px;border-radius:8px;border:none;background:#10a37f;color:#fff;font-weight:600}
.chip{position:absolute;left:14px;right:14px;top:52px;background:#fff8e6;border:1px solid #f3d98b;border-radius:10px;padding:10px 12px;font-size:13px;display:flex;align-items:center;gap:8px}
.chip button{margin-left:auto;border:none;background:var(--blue);color:#fff;border-radius:7px;padding:6px 10px;font-size:12px;font-weight:600}
.stack{position:relative;max-width:400px;margin:24px auto 0}
.card{border-radius:16px;padding:16px 18px;color:#fff;margin-bottom:-14px;position:relative;display:flex;align-items:center;gap:10px;box-shadow:0 -4px 14px #0002;cursor:pointer;min-height:64px}
.card b{flex:1;font-size:16px}.card small{opacity:.8}
.card.front{min-height:170px;flex-direction:column;align-items:stretch;justify-content:space-between;margin-bottom:-14px;cursor:default}
.card .top{display:flex;align-items:center;gap:10px}
.card .hint{font-size:13px;background:#ffffff22;border-radius:8px;padding:8px 10px;display:flex;align-items:center;gap:8px}
.card .hint button{margin-left:auto;border:none;background:#fff;color:#17191d;border-radius:7px;padding:5px 10px;font-size:12px;font-weight:650}
.openai{background:#2b2d31}.zhipu{background:#1d1d1f}.deepseek{background:#4d6bfe}.kimi{background:#111}
.shop h2,.page h2{font-size:26px;margin:0 0 6px}.sub{color:var(--muted);font-size:14px;margin:0 0 22px}
.scard{border:1px solid #d9dce1;border-radius:14px;padding:18px 20px;display:flex;align-items:center;gap:14px;max-width:560px;margin-bottom:12px;background:#fff}
.scard.hl{border-color:var(--accent);box-shadow:0 0 0 3px #0c8df622}
.scard .ic{width:40px;height:40px;border-radius:11px;background:#f4f5f7;display:grid;place-items:center;font-size:18px}
.scard b{display:block;font-size:16px}.scard span{color:var(--muted);font-size:13px}
.scard .price{margin-left:auto;font-weight:700}
.scard button{margin-left:12px;border:none;background:var(--blue);color:#fff;border-radius:9px;padding:8px 14px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:620px}
.two .scard{flex-direction:column;align-items:flex-start;max-width:none}
.two .scard .price{margin-left:0}
.more{margin-top:18px;border:none;background:none;padding:4px 0;color:var(--muted);font-size:12px;font-weight:650}
.scrim{position:absolute;inset:0;background:#171c2433;display:grid;place-items:center;z-index:5}
.dialog{background:#fff;border-radius:18px;padding:26px;width:420px;max-width:92%;box-shadow:0 20px 60px #18243626}
.dialog h3{margin:0 0 10px;font-size:20px}.dialog p{margin:0;color:#30353d;font-size:14px;line-height:1.8}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.actions button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 16px;font-weight:550}
.actions .primary{background:var(--blue);border-color:var(--blue);color:#fff}
.toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:#17191d;color:#fff;padding:8px 15px;border-radius:999px;font-size:13px;z-index:6}
.note{margin-top:12px;min-height:44px}
[hidden]{display:none!important}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes drop{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes glow{0%{box-shadow:0 0 0 0 #0c8df666}70%{box-shadow:0 0 0 10px #0c8df600}100%{box-shadow:0 0 0 3px #0c8df622}}
@keyframes lift{from{transform:translateY(60px);opacity:.6}to{transform:none;opacity:1}}
.ring{display:inline-block;width:16px;height:16px;border:2px solid #ffffff55;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px;margin-right:6px}
.ring.dark{border-color:#0002;border-top-color:#17191d}
.scrim{animation:fade .2s ease}.dialog{animation:pop .25s cubic-bezier(.2,.8,.2,1)}
.chip{animation:drop .35s ease}.dot{animation:pop .3s ease}.toast{animation:rise .3s ease}
.scard.hl{animation:glow 1.2s ease 2}
.card.front.arrive{animation:lift .45s cubic-bezier(.2,.8,.2,1)}
.hint{animation:fade .4s ease}
</style>
<header><h1>商城导流方案</h1><p>可点击原型 · 6 种让用户在需要的时候找到商城的办法，上面切换方案，每个方案都能从头点到「商城」页。</p></header>
<div class="tabs" id="tabs"></div>
<div class="tabs" style="margin-top:-6px;font-size:13px;color:#737982;align-items:center">这台电脑登录过 OpenAI：<b id="signed" style="color:#17191d">没有</b><button id="forget" style="font-size:12px">清除登录记录</button><span>（只影响方案 3）</span></div>
<section class="frame">
  <div class="brand"><img src="../ui/assets/icon.svg" alt="">CodexBuddy</div>
  <nav class="side" id="side"></nav>
  <div class="main"><div class="page" id="page"></div><aside class="browser" id="browser"></aside></div>
  <div id="layer"></div>
</section>
<p class="note" id="note"></p>
<script>
const $=id=>document.getElementById(id);
const V=[
 {id:1,name:'1 切到官方模型后弹窗',note:'点「OpenAI 官方账号」卡：右侧打开 OpenAI 登录页；登录完成后弹窗「用官方 GPT 要手机验证码」，点「去商城购买」直接跳到商城，验证码那张卡高亮。'},
 {id:2,name:'2 登录页上方提示条',note:'切到官方模型后，右侧 OpenAI 登录页顶部浮一条黄色提示「收不到短信验证码？」+「¥35 买一个」，就在用户输手机号的那一刻出现。'},
 {id:3,name:'3 官方卡上直接写（选定）',note:'这台电脑没成功登录过 OpenAI 时，只要 OpenAI 卡在最上面，卡上就显示「注册、登录要手机验证码，订阅更强的 GPT，都在商城」+「去商城」。登录成功一次后再也不显示。'},
 {id:4,name:'4 商城入口带角标',note:'左边导航「商城」旁一个小红角标「¥35」，切到官方模型后才出现，点了进商城。'},
 {id:5,name:'5 商城两张大卡',note:'商城页把「更强的官方 GPT 模型」从小字链接升级成和验证码一样大的卡，两张并排，各有「去购买」按钮。'},
 {id:6,name:'6 切换成功后顺带一句',note:'切到官方模型成功的提示里顺带一句「想用更强的 GPT？去商城」，3 秒后消失。'},
];
let everSignedIn=false;
let v=V[2],page='模型',active='zhipu',loggedIn=false,switching=false;
function tabs(){$('tabs').innerHTML=V.map(x=>`<button data-v="${x.id}" aria-pressed="${x.id===v.id}">${x.name}</button>`).join('');$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{v=V.find(x=>x.id==b.dataset.v);reset();});}
function side(){
  const badge=v.id===4&&active==='openai'?'<span class="dot">¥35</span>':'';
  $('side').innerHTML=['模型','设置','社群','商城'].map(n=>`<button data-n="${n}" ${n===page?'aria-current="page"':''}>${n}${n==='商城'?badge:''}</button>`).join('');
  $('side').querySelectorAll('button').forEach(b=>b.onclick=()=>{page=b.dataset.n;render();});
}
const CARDS=[['openai','OpenAI 官方账号','需要登录'],['zhipu','智谱','免费'],['deepseek','DeepSeek','按用量付费'],['kimi','Kimi','按用量付费']];
function models(){
  const order=[active,...CARDS.map(c=>c[0]).filter(c=>c!==active)];
  const html=order.map((id,i)=>{const c=CARDS.find(x=>x[0]===id);
    if(i===0){const hint=v.id===3&&id==='openai'&&!everSignedIn?`<div class="hint">📱 注册、登录要手机验证码，订阅更强的 GPT，都在商城<button data-shop>去商城</button></div>`:'';
      return `<div class="card front ${id}"><div class="top"><b>${c[1]}</b><small>${switching?'<span class="ring"></span>正在切换':id===active&&(id!=='openai'||loggedIn)?'✓ 正在用':c[2]}</small></div>${hint}<small>MODEL ${id==='openai'?'gpt-5.5':id==='zhipu'?'glm-4.5-flash':'deepseek-chat'}</small></div>`;}
    return `<div class="card ${id}" data-card="${id}"><b>${c[1]}</b><small>${c[2]}</small></div>`;}).join('');
  $('page').innerHTML=`<h2>模型</h2><p class="sub">正在用：${CARDS.find(c=>c[0]===active)[1]}</p><div class="stack">${html}</div>`;
  $('page').querySelectorAll('[data-card]').forEach(el=>el.onclick=()=>switchTo(el.dataset.card));
  $('page').querySelectorAll('[data-shop]').forEach(el=>el.onclick=()=>goShop());
}
function shop(){
  const hl=page==='商城'&&$('page').dataset.hl==='1'?' hl':'';
  if(v.id===5){
    $('page').innerHTML=`<h2>商城</h2><p class="sub">微信 / 支付宝付款，付完自动发货</p><div class="two">
      <div class="scard${hl}"><div class="ic">📱</div><div><b>注册要手机验证码</b><span>注册、登录 OpenAI 官方账号时收短信用</span></div><div class="price">¥35</div><button data-buy="sms">去购买</button></div>
      <div class="scard"><div class="ic">✦</div><div><b>更强的官方 GPT 模型</b><span>官方订阅，开通后在 Codex 里直接用</span></div><div class="price">看套餐</div><button data-buy="gpt">去购买</button></div></div>`;
  } else {
    $('page').innerHTML=`<h2>商城</h2><p class="sub">微信 / 支付宝付款，付完自动发货</p>
      <div class="scard${hl}"><div class="ic">📱</div><div><b>注册要手机验证码</b><span>注册、登录 OpenAI 官方账号时收短信用，收不到可换号</span></div><div class="price">¥35</div></div>
      <button class="more">购买更强的官方 GPT 模型 ›</button>`;
  }
  $('page').querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>openBrowser(b.dataset.buy==='sms'?'shop.humanslive.ai/products/codex-sms':'shop.humanslive.ai/categories/chatgpt','buy'));
  $('page').querySelectorAll('.scard:not(.two .scard), .more').forEach(el=>el.onclick=()=>openBrowser(el.classList.contains('more')?'shop.humanslive.ai/categories/chatgpt':'shop.humanslive.ai/products/codex-sms','buy'));
}
function render(){side();page==='商城'?shop():page==='模型'?models():($('page').innerHTML=`<h2>${page}</h2><p class="sub">（原型只演示模型和商城）</p>`);}
function openBrowser(url,kind){
  const b=$('browser');b.classList.add('open');
  if(kind==='buy'){b.innerHTML=`<div class="bar">🔒 ${url}<button class="x">×</button></div><div class="site"><h3>商品页</h3><p style="color:#737982">（这里是商城的真实页面，付款在这里完成）</p></div>`;}
  else{b.innerHTML=`<div class="bar">🔒 auth.openai.com<button class="x">×</button></div>${v.id===2?'<div class="chip">📱 收不到短信验证码？<button data-shop>¥35 买一个</button></div>':''}<div class="site" style="${v.id===2?'padding-top:96px':''}"><div class="logo">AI</div><h3>登录 OpenAI</h3><input placeholder="邮箱或手机号"><input placeholder="验证码"><button class="go" id="login">继续</button></div>`;
    b.querySelector('#login').onclick=e=>{const btn=e.currentTarget;btn.disabled=true;btn.innerHTML='<span class="ring"></span>正在登录';setTimeout(afterLogin,1000);};}
  b.querySelector('.x').onclick=()=>{b.classList.remove('open');};
  b.querySelectorAll('[data-shop]').forEach(el=>el.onclick=()=>goShop());
}
function switchTo(id){
  active=id;loggedIn=false;$('layer').innerHTML='';switching=true;render();
  $('page').querySelector('.card.front')?.classList.add('arrive');
  setTimeout(()=>{switching=false;render();afterSwitch(id);},900);
}
function afterSwitch(id){
  if(id==='openai'){openBrowser('','login');note('切到官方模型：右侧打开 OpenAI 登录页。'+(v.id===2?'注意登录页顶上的黄色提示条。':'点「继续」模拟登录完成。'));}
  else note(v.note);
}
function afterLogin(){
  loggedIn=true;everSignedIn=true;sign();$('browser').classList.remove('open');render();
  if(v.id===1){
    $('layer').innerHTML=`<div class="scrim"><div class="dialog"><h3>用官方 GPT 要手机验证码</h3><p>注册、登录 OpenAI 时要收一条短信验证码。手上的号收不到，可以在商城买一个，¥35，付完自动发货。</p><div class="actions"><button data-a="later">先不用</button><button class="primary" data-a="shop">去商城购买</button></div></div></div>`;
    $('layer').querySelector('[data-a=later]').onclick=()=>{$('layer').innerHTML='';};
    $('layer').querySelector('[data-a=shop]').onclick=()=>goShop();
    note('登录完成后弹窗：讲清楚为什么要验证码、多少钱，蓝色按钮「去商城购买」直接跳到商城。');
  } else if(v.id===6){
    $('layer').innerHTML=`<div class="toast">已切换到 OpenAI 官方账号 · 想用更强的 GPT？<a href="#" id="t" style="color:#7cc4ff">去商城</a></div>`;
    $('t').onclick=e=>{e.preventDefault();goShop();};setTimeout(()=>{$('layer').innerHTML='';},3500);
    note('切换成功提示里顺带一句「想用更强的 GPT？去商城」，3 秒多后自己消失。');
  } else note(v.note);
}
function goShop(){$('layer').innerHTML='';$('browser').classList.remove('open');page='商城';$('page').dataset.hl='1';render();$('page').dataset.hl='';note('跳到商城：验证码那张卡高亮一下，用户一眼就看到要买的东西。点卡片在右侧打开商品页付款。');}
function note(t){$('note').textContent=t;}
function sign(){$('signed').textContent=everSignedIn?'登录过（卡上不再提示）':'没有';}
$('forget').onclick=()=>{everSignedIn=false;sign();render();note('已清除登录记录：再把 OpenAI 卡挪到最上面，卡上又会出现提示。');};
function reset(){page='模型';active='zhipu';loggedIn=false;$('layer').innerHTML='';$('browser').classList.remove('open');tabs();render();note(v.note+'  ——从「模型」页点「OpenAI 官方账号」卡开始。');}
reset();
</script>
</html>

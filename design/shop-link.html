<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>商城订阅入口</title>
<style>
:root { --ink:#0d0d0d; --ink-2:#5d5d5d; --ink-3:#8f8f8f; --line:#e5e5e5; --side:#f5f5f5; --bg:#fff; --accent:#0c8df6; }
* { box-sizing: border-box; }
body { margin: 0; background: #ececec; font: 14px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--ink); }
.tabs { display: flex; gap: 8px; padding: 16px; flex-wrap: wrap; justify-content: center; }
.tabs button { border: 1px solid #ccc; background: #fff; border-radius: 999px; padding: 6px 14px; font: inherit; cursor: pointer; }
.tabs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.win { display: flex; max-width: 980px; height: 520px; margin: 0 auto 24px; background: var(--bg); border-radius: 12px; overflow: hidden; box-shadow: 0 8px 30px #0002; }
.nav { width: 168px; background: var(--side); padding: 18px 12px; font-size: 13px; color: var(--ink-2); }
.nav b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 18px; }
.nav div { padding: 8px 10px; border-radius: 8px; }
.nav .on { background: #fff; color: var(--ink); font-weight: 600; }
.main { flex: 1; padding: 36px 40px; position: relative; }
h1 { margin: 0; font-size: 22px; }
.sub { color: var(--ink-2); font-size: 13px; margin: 6px 0 22px; }
.card { display: flex; align-items: center; gap: 16px; max-width: 520px; padding: 18px 20px; border: 1px solid var(--line); border-radius: 14px; cursor: pointer; }
.card:hover { border-color: var(--ink-3); }
.ic { width: 40px; height: 40px; border-radius: 11px; background: var(--side); display: grid; place-items: center; font-size: 20px; }
.card strong { display: block; font-size: 15px; }
.card span { font-size: 13px; color: var(--ink-2); }
.price { margin-left: auto; font-weight: 600; }
.slot { margin-top: 22px; }
.browser { position: absolute; inset: 0; background: #fff; display: none; flex-direction: column; animation: slide .25s ease; }
.browser.show { display: flex; }
@keyframes slide { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--ink-2); }
.bar button { border: 0; background: var(--side); border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
.page { flex: 1; display: grid; place-items: center; color: var(--ink-3); }
svg { display: block; }

/* 1 星芒图标 + 下划线 + 大箭头 */
.v1 { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; padding: 4px 0; font: inherit; font-size: 13px; font-weight: 650; color: var(--ink); cursor: pointer; }
.v1 .t { text-decoration: underline; text-underline-offset: 3px; }
.v1 .a { transition: transform .15s; }
.v1:hover .a { transform: translateX(4px); }

/* 2 黑色小圆箭头 */
.v2 { display: inline-flex; align-items: center; gap: 10px; border: 0; background: none; padding: 4px 0; font: inherit; font-size: 13px; font-weight: 650; color: var(--ink); cursor: pointer; }
.v2 .t { text-decoration: underline; text-underline-offset: 3px; }
.v2 .c { width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; transition: transform .15s; }
.v2:hover .c { transform: translateX(3px); }

/* 3 描边胶囊 */
.v3 { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--ink); border-radius: 999px; background: #fff; padding: 8px 16px; font: inherit; font-size: 13px; font-weight: 650; color: var(--ink); cursor: pointer; transition: background .15s, color .15s; }
.v3:hover { background: var(--ink); color: #fff; }
.v3 .a { transition: transform .15s; }
.v3:hover .a { transform: translateX(3px); }

/* 4 列表行（和上面的卡同族，小一号） */
.v4 { display: flex; align-items: center; gap: 12px; max-width: 520px; width: 100%; border: 1px solid var(--line); border-radius: 12px; background: #fff; padding: 12px 16px; font: inherit; color: var(--ink); cursor: pointer; text-align: left; }
.v4:hover { border-color: var(--ink-3); background: #fafafa; }
.v4 .ic2 { width: 30px; height: 30px; border-radius: 8px; background: var(--ink); color: #fff; display: grid; place-items: center; }
.v4 .t { font-size: 13px; font-weight: 650; text-decoration: underline; text-underline-offset: 3px; }
.v4 .a { margin-left: auto; transition: transform .15s; }
.v4:hover .a { transform: translateX(3px); }

/* 5 外链图标 */
.v5 { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; padding: 4px 0; font: inherit; font-size: 13px; font-weight: 650; color: var(--ink); cursor: pointer; }
.v5 .t { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1.5px; }
.v5 .ext { transition: transform .15s; }
.v5:hover .ext { transform: translate(2px, -2px); }
.v5:hover .t { text-decoration-thickness: 2.5px; }
</style>
</head>
<body>
<div class="tabs" id="tabs"></div>
<div class="win">
  <div class="nav"><b>CodexBuddy</b><div>模型</div><div>设置</div><div>社群</div><div class="on">商城</div></div>
  <div class="main">
    <h1>商城</h1>
    <p class="sub">微信 / 支付宝付款，付完自动发货</p>
    <div class="card" onclick="openB('codex-sms')"><div class="ic">📱</div><div><strong>注册要手机验证码</strong><span>注册、登录 OpenAI 官方账号时收短信用，收不到可换号</span></div><div class="price">¥35</div></div>
    <div class="slot" id="slot"></div>
    <div class="browser" id="browser"><div class="bar"><button onclick="closeB()">✕</button><span id="url"></span></div><div class="page">右侧浏览器（示意）</div></div>
  </div>
</div>
<script>
const spark = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.2 6.6L21 11l-6.8 2.4L12 20l-2.2-6.6L3 11l6.8-2.4z"/></svg>';
const arrow = s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;
const ext = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></svg>';
const T = '购买更强的官方 GPT 模型';
const V = [
  ['1 星芒＋下划线＋箭头', `<button class="v1">${spark}<span class="t">${T}</span><span class="a">${arrow(16)}</span></button>`],
  ['2 黑色圆形箭头', `<button class="v2"><span class="t">${T}</span><span class="c">${arrow(13)}</span></button>`],
  ['3 描边胶囊按钮', `<button class="v3">${spark}<span>${T}</span><span class="a">${arrow(15)}</span></button>`],
  ['4 小一号的卡片行', `<button class="v4"><span class="ic2">${spark}</span><span class="t">${T}</span><span class="a">${arrow(18)}</span></button>`],
  ['5 外链图标 ↗', `<button class="v5"><span class="t">${T}</span><span class="ext">${ext}</span></button>`],
];
const tabs = document.getElementById('tabs'), slot = document.getElementById('slot');
function pick(i) {
  [...tabs.children].forEach((b, j) => b.classList.toggle('on', i === j));
  slot.innerHTML = V[i][1];
  slot.firstChild.onclick = () => openB('chatgpt');
  closeB();
}
V.forEach(([name], i) => { const b = document.createElement('button'); b.textContent = name; b.onclick = () => pick(i); tabs.append(b); });
function openB(k) { document.getElementById('url').textContent = k === 'chatgpt' ? 'shop.humanslive.ai/categories/chatgpt' : 'shop.humanslive.ai/products/codex-sms'; document.getElementById('browser').classList.add('show'); }
function closeB() { document.getElementById('browser').classList.remove('show'); }
pick(0);
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>启动联网检测 · 5 版原型</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#17191d;background:#fff;--line:#e8eaee;--muted:#737982;--blue:#0a77d1;--red:#c82f39}*{box-sizing:border-box}body{margin:0;padding:30px 38px}header,.controls,.frame,.note{max-width:1120px;margin-left:auto;margin-right:auto}h1{font-size:24px;letter-spacing:-.6px;margin:0 0 10px}header p,.note{font-size:13px;color:var(--muted);line-height:1.8}button,select{font:inherit}button{cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 18px;font-size:14px;font-weight:550;color:#25282e}button:hover{background:#f6f7f8}button:disabled{opacity:.6;cursor:wait}button:focus-visible,select:focus-visible{outline:3px solid #0c8df6;outline-offset:3px}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.primary:hover{background:#0868ba}.tabs{display:flex;gap:9px;flex-wrap:wrap;margin:22px 0 18px}.tab{border-radius:99px;font-size:13px;padding:9px 15px}.tab[aria-selected=true]{border-color:#0c8df6;color:var(--blue)}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;color:var(--muted);font-size:13px}.controls button{font-size:13px;padding:7px 12px}select{padding:7px 9px;background:#fff;border:1px solid var(--line);border-radius:8px;color:#30353d}.frame{height:650px;position:relative;border:1px solid #e0e3e8;border-radius:17px;background:#fff;overflow:hidden;box-shadow:0 16px 50px #1522390b}.brand{position:absolute;top:25px;left:28px;display:flex;gap:10px;align-items:center;font-weight:650;font-size:16px}.brand img{width:27px;height:27px}.window{position:absolute;right:22px;top:21px;display:flex;gap:26px;color:#7f8590;font-size:18px}.center{height:100%;display:flex;align-items:center;justify-content:center;padding:65px 30px}.content{text-align:center;width:440px}.content h2,.dialog h2,.sheet h2,.panel h2{font-size:25px;letter-spacing:-.7px;margin:21px 0 12px}.content p,.dialog p,.sheet p,.panel p{font-size:14px;line-height:1.8;color:var(--muted);margin:0}.content .primary{min-width:140px;margin-top:27px}.glyph{width:62px;height:62px;border:1px solid var(--line);border-radius:18px;margin:0 auto;display:grid;place-items:center;color:var(--red)}svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.spinner{width:39px;height:39px;border:3px solid var(--line);border-top-color:#0c8df6;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto}.loading h2{font-size:21px;margin-top:27px}.loading p{font-size:13px}.scrim{position:absolute;inset:0;display:grid;place-items:center;padding:20px;background:#171c2426}.dialog{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px #18243619;padding:30px;width:440px;max-width:100%}.dialog h2{font-size:22px;margin-top:0}.dialog .glyph{width:46px;height:46px;margin:0 0 23px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:27px}.shell-logo{width:62px;height:62px;opacity:.45}.small-title{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:26px}.detail-link{display:block;border:none;margin:15px auto 0;color:#626a76;font-size:13px;padding:5px 8px}.details{border-top:1px solid var(--line);margin-top:24px;padding-top:17px;text-align:left;color:#737982;font-size:13px}.detail-row{display:flex;justify-content:space-between;padding:9px 0}.detail-row b{font-weight:500;color:var(--red)}.details .copy{padding:7px 12px;font-size:12px;margin-top:10px}.sheet{position:absolute;bottom:0;left:0;right:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;background:#fff;padding:30px 35px;display:flex;align-items:center;gap:22px;box-shadow:0 -10px 45px #1824360b}.sheet .glyph{margin:0;flex-shrink:0;width:52px;height:52px}.sheet h2{font-size:21px;margin:0 0 9px}.sheet .message{flex:1}.sheet .actions{margin:0}.panel{position:absolute;top:0;bottom:0;right:0;width:390px;border-left:1px solid var(--line);background:#fff;padding:115px 30px 30px;display:flex;flex-direction:column;box-shadow:-10px 0 40px #18243608}.panel .glyph{margin:0;width:50px;height:50px}.panel h2{font-size:23px}.panel .primary{margin-top:auto}.help{border-top:1px solid var(--line);margin-top:28px;padding-top:20px}.help summary{font-size:14px;cursor:pointer}.help p{margin-top:13px;font-size:13px}.success-mark{color:var(--blue);font-size:36px}.entered{padding:105px 55px;display:flex;height:100%;gap:50px}.nav{width:120px;color:var(--muted);font-size:14px;line-height:3}.nav strong{color:#17191d}.workspace h2{font-size:26px;margin:0 0 30px}.model-card{border:1px solid var(--line);border-radius:17px;padding:25px;width:380px;max-width:100%}.model-card img{width:29px;height:29px;vertical-align:middle;margin-right:10px}.model-card b{font-size:18px}.model-card p{font-size:14px;margin:25px 0 0;color:var(--muted)}.alert{color:var(--red);margin-left:auto}.note{margin-top:16px;min-height:42px}.status-page .app-large{width:68px;height:68px;margin-bottom:25px}.exit .content p{margin-top:12px}.exit .primary{margin-top:25px}[hidden]{display:none!important}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:750px){body{padding:22px 12px}.frame{height:610px}.panel{width:340px}.sheet{flex-wrap:wrap;padding:25px}.sheet .message{min-width:220px}.sheet .actions{margin-left:auto}.entered{gap:15px;padding:110px 25px}.nav{width:60px;flex-shrink:0}.model-card{width:100%}}@media(max-width:470px){.panel{width:100%;padding-top:105px}.brand{left:20px}.center{padding-left:22px;padding-right:22px}.dialog{padding:25px}.content h2{font-size:23px}.sheet .glyph{display:none}}@media(prefers-reduced-motion:reduce){.spinner{animation-duration:2s}}
</style>
<header><h1>启动联网检测</h1><p>5 版可点击原型 · 只演示页面效果，不修改任何设置</p><div class="tabs" role="tablist" aria-label="选择报错样式"></div></header>
<div class="controls"><label>连接结果 <select id="result"><option value="offline">连接失败</option><option value="online">连接成功</option></select></label><button id="replay">重新启动演示</button><button id="disconnect" hidden>模拟使用中断网</button><span id="description"></span></div>
<section class="frame" aria-label="CodexBuddy 启动原型"><div class="brand"><img src="../ui/assets/icon.svg" alt="">CodexBuddy</div><div class="window" aria-hidden="true"><span>−</span><span>□</span><span>×</span></div><main id="screen" aria-live="polite" style="height:100%"></main></section><p class="note" id="note"></p>
<script>
const $=id=>document.getElementById(id);let current=1;let timer;let interrupted=false;
const variants=[['居中报错','推荐：只保留连接结果和一个重试按钮。'],['确认弹窗','弹窗阻止进入应用，可以重试或退出。'],['展开详情','默认简洁，连接结果和日志按需展开。'],['底部提示','连接失败后，在窗口底部集中处理。'],['连接帮助','在右侧显示报错，并提供可展开的检查建议。']];
const networkIcon='<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 23a6 6 0 0 1-1-11 9 9 0 0 1 17-2 7 7 0 0 1 3 13"/><path d="m12 18 8 8m0-8-8 8"/></svg>';
function nav(){document.querySelector('.tabs').innerHTML=variants.map(([name],i)=>`<button class="tab" role="tab" id="tab-${i+1}" data-v="${i+1}" aria-selected="${current===i+1}">${i+1} · ${name}</button>`).join('');document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{current=+b.dataset.v;history.replaceState(null,'','#v'+current);nav();start()});$('description').textContent=variants[current-1][1];}
function start(){clearTimeout(timer);$('disconnect').hidden=true;$('screen').innerHTML='<div class="center"><div class="content loading" role="status"><div class="spinner" aria-hidden="true"></div><h2>正在连接</h2><p>连接成功后即可使用</p></div></div>';$('note').textContent='演示中：连接成功前，没有进入模型、设置或安装的入口。';timer=setTimeout(()=>{$('result').value==='online'?enter():fail()},1300);}
function message(){return ['网络问题','请检查网络后重试。'];}
function fail(){const [title,reason]=message();const glyph=`<div class="glyph">${networkIcon}</div>`;const retry='<button class="primary" data-action="retry">重试</button>';let html;
if(current===1)html=`<div class="center"><div class="content">${glyph}<h2>${title}</h2><p>${reason}</p>${retry}</div></div>`;
if(current===2)html=`<div class="center"><img class="shell-logo" src="../ui/assets/icon.svg" alt=""></div><div class="scrim"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="error-title">${glyph}<h2 id="error-title">${title}</h2><p>${reason}</p><div class="actions"><button data-action="exit">退出</button>${retry}</div></section></div>`;
if(current===3)html=`<div class="center"><div class="content">${glyph}<h2>${title}</h2><p>${reason}</p>${retry}<button class="detail-link" data-action="details" aria-expanded="false">查看详情</button><div class="details" hidden><div class="detail-row"><span>连接结果</span><b>${title}</b></div><div class="detail-row"><span>应用功能</span><span>未开放</span></div><button class="copy" data-action="copy">复制日志</button></div></div></div>`;
if(current===4)html=`<div class="center"><img class="shell-logo" src="../ui/assets/icon.svg" alt=""></div><section class="sheet">${glyph}<div class="message"><h2>${title}</h2><p>${reason}</p></div><div class="actions"><button data-action="exit">退出</button>${retry}</div></section>`;
if(current===5)html=`<div class="center"><img class="shell-logo" src="../ui/assets/icon.svg" alt=""></div><section class="panel">${glyph}<h2>${title}</h2><p>${reason}</p><details class="help"><summary>连接帮助</summary><p>先确认浏览器能否打开其他网页。</p><p>使用代理时，可尝试关闭后重试。</p></details>${retry}</section>`;
$('screen').innerHTML=html;$('note').textContent=(interrupted?'使用中断网：功能入口已收起。':'连接失败：功能入口保持关闭。')+' 可点击「重试」，或在上方切换为「连接成功」。';wire();}
function wire(){document.querySelectorAll('[data-action="retry"]').forEach(b=>b.onclick=()=>{interrupted=false;start()});document.querySelectorAll('[data-action="exit"]').forEach(b=>b.onclick=()=>{$('screen').innerHTML='<div class="center exit"><div class="content"><img class="shell-logo" src="../ui/assets/icon.svg" alt=""><h2>CodexBuddy 已退出</h2><button class="primary" data-action="retry">重新打开</button></div></div>';$('note').textContent='原型模拟退出；正式版会关闭应用。';wire()});const details=document.querySelector('[data-action="details"]');if(details)details.onclick=()=>{const block=document.querySelector('.details');block.hidden=!block.hidden;details.setAttribute('aria-expanded',String(!block.hidden));details.textContent=block.hidden?'查看详情':'收起详情'};const copy=document.querySelector('[data-action="copy"]');if(copy)copy.onclick=()=>{copy.textContent='已复制';$('note').textContent='演示复制日志：正式版复制经过脱敏的连接日志。';};}
function enter(){$('screen').innerHTML='<div class="entered"><aside class="nav"><strong>模型</strong><br>设置<br>社群</aside><section class="workspace"><h2>模型</h2><div class="model-card"><img src="../ui/assets/logos/deepseek.png" alt=""><b>DeepSeek</b><p>DeepSeek V3</p></div></section></div>';$('disconnect').hidden=false;$('note').textContent='连接成功：进入应用。可点上方「模拟使用中断网」，检查功能入口是否重新关闭。';}
$('disconnect').onclick=()=>{interrupted=true;$('disconnect').hidden=true;fail()};$('result').onchange=()=>{interrupted=false;start()};$('replay').onclick=()=>{interrupted=false;start()};const match=location.hash.match(/^#v([1-5])$/);if(match)current=+match[1];nav();start();
</script>
</html>
